<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HitterLoop — At-Bat</title><link rel="stylesheet" href="./coach.css?v=ad8853043a"><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#121418">
</head><body>
<header class="app-bar" id="appBar"></header><main class="wrap bt-atbat-page">
<div id="countStrip" class="bt-count-strip">Loading at-bat…</div><div id="pitches"></div><div id="facts"></div></main>
<div id="pitchActions"></div><nav class="bottom-nav" id="bottomNav"></nav>
<script src="./demo.local.js"></script><script src="./config.local.js"></script><script type="module">
import { supabase, requireSession, qs, escapeHtml, getMyDisplayName } from "./shared.js";
import { getDemoConfig } from "./demoConfig.js";
import { L, buildContext, PLAYER_SELECT, emptyState } from "./components/devUi.js";
import { renderBottomNav, renderDrillInAppBar } from "./components/appShell.js";
import { button, confirmDialog, icon, openBottomSheet, openOverflowMenu, showSnackbar, statusChip } from "./components/ui.js";
import { insertPitchCollisionSafe, likelyAtBatOver, pitchCountTitle, pitchMetaParts, pitchPatchForCountOverride, pitchPatchForOutcome } from "./components/pitchEntry.js";
import { zoneLabel } from "./components/pitchZonePicker.js";
import { uploadRawClip } from "./components/videoUpload.js";

const entryId = qs("entry"); let ctx, entry, pitches = [], clips = [], clipsLoaded = false; const uploads = new Map();
const failedUploadKey = `bt:failed-pitch-uploads:${entryId}`;
const outcomes = [["ball","Ball"],["called_strike","Called strike"],["swinging_strike","Swinging strike"],["foul","Foul"],["ball_in_play","In play"],["hit_by_pitch","Hit by pitch"]];

async function main() {
  const session = await requireSession(); if (!session || !entryId) return;
  const { data, error } = await supabase.from("game_log_entries").select(`id,date,opponent,ab,result,session_type,ai_summary,ai_summary_generated_at,players!inner(${PLAYER_SELECT})`).eq("id", entryId).single();
  if (error || !data) { document.getElementById("countStrip").textContent = "This at-bat wasn't found."; return; }
  entry = data; ctx = buildContext(session, await getMyDisplayName(session.user.id), data.players);
  renderDrillInAppBar(document.getElementById("appBar"), { title: `At-bat ${entry.ab}${entry.opponent ? ` · vs ${entry.opponent}` : ""}`, backHref: ctx.url("player"), backLabel: `Back to ${ctx.player.name}`, overflowItems: [
    { label: "Edit at-bat", icon: "pencil", onSelect: openEditAtBat },
    { label: "Unassigned video", icon: "video", onSelect: openUnassigned },
    { label: "At-bat summary", icon: "layout-list", onSelect: () => document.getElementById("factsDisclosure")?.setAttribute("open", "") },
  ] });
  renderBottomNav(document.getElementById("bottomNav"), { teamSlug: ctx.teamSlug, activeTab: "", currentPlayer: ctx.player, roster: [ctx.player] });
  await reload();
}

async function loadPitches() { const { data, error } = await supabase.from("at_bat_pitches").select("*").eq("game_log_entry_id", entryId).order("pitch_number"); if (error) throw error; return data ?? []; }
async function reload() {
  const [p, c] = await Promise.all([loadPitches(), supabase.from("video_clips").select("id,status,error_message,at_bat_pitch_id,created_at").eq("game_log_entry_id", entryId).order("created_at")]);
  // "Analyzed" = the clip has an analysis_runs row (as on player/review). If
  // either lookup fails, analysis state stays unknown for the summary.
  clipsLoaded = !c.error;
  const readyIds = (c.data ?? []).filter((clip) => clip.status === "ready").map((clip) => clip.id);
  const runs = readyIds.length ? await supabase.from("analysis_runs").select("video_clip_id").in("video_clip_id", readyIds) : { data: [] };
  pitches = p; clips = L.markClipsAnalyzed(c.data, runs.error ? null : (runs.data ?? []).map((row) => row.video_clip_id));
  try { for (const id of JSON.parse(sessionStorage.getItem(failedUploadKey) ?? "[]")) if (!uploads.has(id)) uploads.set(id, { state: "failed_lost" }); } catch { /* ignore corrupt session state */ }
  render();
}
function clipState(list, pitchId) {
  const local = uploads.get(pitchId); if (local?.state === "uploading") return statusChip("pending", { domain: "processing", label: "Uploading…" });
  if (local?.state === "failed") return `<button class="bt-evidence-chip failed" data-action="retry">Failed · Retry</button>`;
  if (local?.state === "failed_lost") return `<button class="bt-evidence-chip failed upload-control" data-action="camera">Re-record to try again</button>`;
  if (!clipsLoaded) return '<span class="bt-evidence-chip">Video status unavailable</span>';
  if (!list.length) return '<span class="bt-evidence-chip">No video</span>';
  // A recorded swing is the point of this screen: its Review link is visible in the row, not only in the menu.
  // TODO(separate UX patch): a pitch explicitly recorded as a take (or with swing/take not recorded) still shows "Review swing" here and in its menu - correct the terminology.
  const ready = list.find((clip) => clip.status === "ready");
  if (ready) return `<a class="bt-button bt-button-secondary bt-review-swing" href="${ctx.url("review", { clip: ready.id })}">Review swing</a>`;
  if (list.length > 1) return `<span class="bt-evidence-chip">${list.length} clips</span>`;
  const clip = list[0]; return statusChip(clip.status, { domain: "processing", label: clip.status === "pending" ? "Waiting to process" : undefined });
}
function render() {
  const inferred = L.inferCounts(pitches); const next = L.nextPitchNumber(pitches); const end = likelyAtBatOver(pitches);
  document.getElementById("countStrip").innerHTML = `<strong>Swing evidence</strong><span>${pitches.length ? `${pitches.length} pitch${pitches.length === 1 ? "" : "es"}` : "Game details unavailable"}</span>`;
  const host = document.getElementById("pitches");
  if (!pitches.length) host.innerHTML = emptyState("No pitches yet", "Record or log the first pitch.");
  else host.innerHTML = inferred.map(({ pitch, balls, strikes, inferred: countInferred }) => {
    const list = clips.filter((clip) => clip.at_bat_pitch_id === pitch.id);
    return `<article class="bt-pitch-row" data-pid="${pitch.id}" role="listitem"><span class="bt-pitch-number" aria-hidden="true">${pitch.pitch_number}</span><button type="button" class="bt-list-row-copy bt-pitch-main" data-action="details" aria-label="Pitch ${pitch.pitch_number}. Edit details"><strong>Pitch ${pitch.pitch_number}</strong>${pitch.notes ? `<small>${escapeHtml(pitch.notes)}</small>` : ""}</button>${clipState(list, pitch.id)}<button class="bt-icon-button upload-control" data-action="camera" aria-label="Add video to pitch ${pitch.pitch_number}">${icon("camera", { size: 20 })}</button><button class="bt-icon-button" data-action="menu" aria-label="More actions for pitch ${pitch.pitch_number}">${icon("ellipsis-vertical", { size: 20 })}</button></article>`;
  }).join("");
  host.setAttribute("role", "list"); host.onclick = onPitchClick;
  const summary = currentSummary();
  const saveAction = L.atBatSummaryComplete(summary) ? button("Save summary", { variant: "secondary", attrs: 'id="saveSummary"' }) : `<p class="bt-caption">Analysis status couldn't be confirmed, so this summary can't be saved yet. Reload the page to try again.</p>`;
  document.getElementById("facts").innerHTML = `<details class="bt-disclosure" id="factsDisclosure"><summary><span>At-bat summary</span><span class="bt-caption">${summary.pitchCount} pitch${summary.pitchCount === 1 ? "" : "es"}${pitches.every((pitch) => pitch.swung != null) ? ` · ${summary.swings} swing${summary.swings === 1 ? "" : "s"}` : ""}</span></summary><div class="bt-disclosure-body"><p>${escapeHtml(L.atBatFactsSummary(summary))}</p>${saveAction}</div></details>`;
  document.getElementById("saveSummary")?.addEventListener("click", saveSummary);
  document.getElementById("pitchActions").innerHTML = end
    ? `<div class="bt-sticky-action-bar"><a class="bt-button bt-button-primary" href="${ctx.url("player")}">Done</a>${button(`Record pitch ${next}`, { variant: "tertiary", className: "upload-control", attrs: 'id="recordPitch"' })}${button("Log without video", { variant: "tertiary", attrs: 'id="logPitch"' })}</div>`
    : `<div class="bt-sticky-action-bar">${button(`Record pitch ${next}`, { variant: "primary", className: "upload-control", attrs: 'id="recordPitch"' })}${button("Log without video", { variant: "secondary", attrs: 'id="logPitch"' })}</div>`;
  document.getElementById("recordPitch")?.addEventListener("click", recordPitch);
  document.getElementById("logPitch")?.addEventListener("click", async () => openOutcome(await createPitch()));
}
async function createPitch() {
  try { return await insertPitchCollisionSafe({ loadPitches, insertPitch: async (pitch_number) => { const { data, error } = await supabase.from("at_bat_pitches").insert({ game_log_entry_id: entryId, pitch_number }).select("*").single(); if (error) throw error; pitches.push(data); render(); return data; } }); }
  catch { showSnackbar("Couldn't add the pitch. Try again."); return null; }
}
// The single chokepoint every upload/camera/"add another video" entry
// point on this page routes through (Record pitch, the per-pitch camera
// icon, and the overflow menu's "Add another video" item all call this).
// Demo mode never creates or clicks the OS file/camera picker at all - not
// just a post-pick network block (that's videoUpload.js's uploadRawClip()
// gate, still in place as defense in depth) - matching the same
// capabilities.uploads flag player.html's upload controls already use, via
// the one centralized demoConfig.js, not a pathname check.
function chooseVideo({ capture = true, onFile }) {
  if (!getDemoConfig().capabilities.uploads) { showSnackbar("Uploads are turned off in this demo."); return; }
  const input = document.createElement("input"); input.type = "file"; input.accept = "video/*"; if (capture) input.capture = "environment"; input.onchange = () => { const file = input.files?.[0]; if (file) onFile(file); }; input.click();
}
function recordPitch() { chooseVideo({ onFile: async (file) => { const pitch = await createPitch(); if (!pitch) return; uploads.set(pitch.id, { state: "uploading", file }); render(); openOutcome(pitch); uploadForPitch(pitch, file); } }); }
async function uploadForPitch(pitch, file) {
  if (!file) return showSnackbar("Re-record to try again.");
  try { await uploadRawClip(entryId, file, { pitchId: pitch.id }); uploads.delete(pitch.id); rememberFailed(); showSnackbar(`Video attached to pitch ${pitch.pitch_number}`); await reload(); }
  catch { uploads.set(pitch.id, { state: "failed", file }); rememberFailed(); render(); showSnackbar("Video upload failed. The pitch was kept."); }
}
function rememberFailed(){try{sessionStorage.setItem(failedUploadKey,JSON.stringify([...uploads].filter(([,value])=>value.state.startsWith("failed")).map(([id])=>id)));}catch{/* session storage unavailable */}}
function zoneGrid(selected = null) { return `<div class="bt-zone-grid" role="group" aria-label="Strike-zone location">${Array.from({ length: 9 }, (_, i) => i + 1).map((zone) => `<button type="button" data-zone="${zone}" aria-pressed="${zone === selected}" class="${zone === selected ? "selected" : ""}" aria-label="${zoneLabel(zone)}, zone ${zone}">${zone}</button>`).join("")}</div><p class="bt-caption">Strike zone only — leave blank for pitches outside it.</p>`; }
function openOutcome(pitch) {
  if (!pitch) return; let zone = pitch.pitch_zone ?? null;
  const sheet = openBottomSheet({ title: pitchCountTitle(pitch.pitch_number, pitches), ariaLabel: `Record outcome for pitch ${pitch.pitch_number}`, bodyHtml: `<div class="bt-outcome-grid" role="radiogroup" aria-label="Pitch outcome">${outcomes.map(([value,label]) => `<button type="button" data-outcome="${value}" aria-pressed="${pitch.pitch_outcome === value}">${label}</button>`).join("")}</div><div class="bt-outcome-grid" id="otherOutcomes" hidden><button type="button" data-outcome="other">Other</button></div><details class="bt-disclosure"><summary><span>Add location (optional)</span></summary><div class="bt-disclosure-body">${zoneGrid(zone)}</div></details><div class="bt-inline-actions"><button class="bt-button bt-button-tertiary" data-detail="other">Other outcome</button><button class="bt-button bt-button-tertiary" data-detail="note">Note</button><button class="bt-button bt-button-tertiary" data-detail="count">Fix count</button></div>` });
  sheet.querySelectorAll("[data-zone]").forEach((el) => el.onclick = () => { zone = Number(el.dataset.zone); sheet.querySelectorAll("[data-zone]").forEach((b) => { b.classList.toggle("selected", b === el); b.setAttribute("aria-pressed", String(b === el)); }); });
  sheet.querySelectorAll("[data-outcome]").forEach((el) => el.onclick = () => saveOutcome(sheet, pitch, el.dataset.outcome, zone));
  sheet.querySelector('[data-detail="other"]').onclick = () => { sheet.querySelector("#otherOutcomes").hidden = false; };
  sheet.querySelectorAll('[data-detail="note"],[data-detail="count"]').forEach((el) => el.onclick = () => openDetails(pitch, sheet));
}
async function saveOutcome(sheet, pitch, outcome, zone) {
  const patch = pitchPatchForOutcome(outcome, zone); const { error } = await supabase.from("at_bat_pitches").update(patch).eq("id", pitch.id);
  if (error) { showSnackbar(`Couldn't save pitch ${pitch.pitch_number}`, { actionLabel: "Retry", onAction: () => saveOutcome(sheet, pitch, outcome, zone) }); return; }
  Object.assign(pitch, patch); sheet.remove(); await sheet.whenClosed; showSnackbar(`Pitch ${pitch.pitch_number} · ${L.PITCH_OUTCOME_LABELS[outcome]} saved`, { actionLabel: "Change", onAction: () => openOutcome(pitch) }); await reload();
}
function onPitchClick(event) {
  const row = event.target.closest("[data-pid]"); if (!row) return; const pitch = pitches.find((item) => item.id === row.dataset.pid); const action = event.target.closest("[data-action]")?.dataset.action;
  if (!action) return openDetails(pitch);
  if (action === "camera") return chooseVideo({ onFile: (file) => uploadForPitch(pitch, file) });
  if (action === "retry") return uploadForPitch(pitch, uploads.get(pitch.id)?.file);
  if (action === "menu") return openPitchMenu(pitch, event.target.closest("button"));
}
function openPitchMenu(pitch, anchor) {
  const list = clips.filter((clip) => clip.at_bat_pitch_id === pitch.id); const ready = list.find((clip) => clip.status === "ready");
  openOverflowMenu({ title: `Pitch ${pitch.pitch_number}`, anchor, items: [
    { label: "Change outcome", icon: "pencil", onSelect: () => openOutcome(pitch) }, { label: "Edit details", icon: "pencil", onSelect: () => openDetails(pitch) },
    // Excluded from the menu entirely in demo mode, not just gated after
    // the fact - matches the "hide or disable" requirement, not merely
    // "block after the picker already opened".
    ...(getDemoConfig().capabilities.uploads ? [{ label: "Add another video", icon: "camera", onSelect: () => chooseVideo({ onFile: (file) => uploadForPitch(pitch, file) }) }] : []),
    ...(ready ? [{ label: "Review swing", icon: "video", onSelect: () => location.href = ctx.url("review", { clip: ready.id }) }] : []),
    { label: "Delete pitch", icon: "trash-2", destructive: true, onSelect: () => deletePitch(pitch) },
  ] });
}
async function deletePitch(pitch) { if (!await confirmDialog({ title: `Delete pitch ${pitch.pitch_number}?`, message: "Its video will stay on this at-bat as unassigned evidence.", confirmLabel: "Delete pitch", destructive: true })) return; const { error } = await supabase.from("at_bat_pitches").delete().eq("id", pitch.id); if (error) return showSnackbar("Couldn't delete the pitch."); await reload(); showSnackbar(`Pitch ${pitch.pitch_number} deleted`); }
function openDetails(pitch, priorSheet = null) {
  priorSheet?.remove(); const inferred = L.inferCounts(pitches).find((row) => row.pitch.id === pitch.id); const opt = (n, selected) => `<option value="${n}" ${n === selected ? "selected" : ""}>${n}</option>`;
  let zone = pitch.pitch_zone ?? null; const sheet = openBottomSheet({ title: `Pitch ${pitch.pitch_number} details`, bodyHtml: `${pitch.pitch_location ? `<p class="bt-caption">From earlier entry: ${escapeHtml(pitch.pitch_location)}</p>` : ""}<div class="dev-field"><label>Outcome</label><button type="button" class="bt-button bt-button-secondary" id="changeOutcome">${escapeHtml(L.PITCH_OUTCOME_LABELS[pitch.pitch_outcome] ?? "Not recorded")} · Change outcome</button></div>${zoneGrid(zone)}<div class="dev-field"><label>Swing or take</label><select id="detailSwung"><option value="" ${pitch.swung == null ? "selected" : ""}>Infer from outcome</option><option value="true" ${pitch.swung === true ? "selected" : ""}>Swing</option><option value="false" ${pitch.swung === false ? "selected" : ""}>Take</option></select></div><div class="bt-count-fix"><label>Balls before<select id="detailBalls">${[0,1,2,3].map((n)=>opt(n,inferred?.balls)).join("")}</select></label><label>Strikes before<select id="detailStrikes">${[0,1,2].map((n)=>opt(n,inferred?.strikes)).join("")}</select></label></div><div class="dev-field"><label>Note</label><textarea id="detailNote">${escapeHtml(pitch.notes ?? "")}</textarea></div>`, footerHtml: '<button class="bt-button bt-button-primary" id="savePitchDetails">Save details</button>' });
  sheet.querySelectorAll("[data-zone]").forEach((el) => el.onclick = () => { zone = Number(el.dataset.zone); sheet.querySelectorAll("[data-zone]").forEach((b) => b.classList.toggle("selected", b === el)); });
  sheet.querySelector("#changeOutcome").onclick = () => { sheet.remove(); sheet.whenClosed.then(() => openOutcome(pitch)); };
  sheet.querySelector("#savePitchDetails").onclick = async () => { const swung = sheet.querySelector("#detailSwung").value; const patch = { pitch_zone: zone, swung: swung === "" ? null : swung === "true", ...pitchPatchForCountOverride(Number(sheet.querySelector("#detailBalls").value), Number(sheet.querySelector("#detailStrikes").value), inferred), notes: sheet.querySelector("#detailNote").value.trim() || null }; const { error } = await supabase.from("at_bat_pitches").update(patch).eq("id", pitch.id); if (error) return showSnackbar("Couldn't save pitch details."); sheet.remove(); await reload(); showSnackbar("Pitch details saved"); };
}
function openUnassigned() { const loose = clips.filter((clip) => !clip.at_bat_pitch_id); const sheet = openBottomSheet({ title: "Unassigned video", bodyHtml: !clipsLoaded ? emptyState("Video couldn't be loaded", "Reload the page to try again.") : loose.length ? loose.map((clip) => `<section class="bt-card" data-unassigned="${clip.id}"><strong>Video evidence · ${escapeHtml(clip.status)}</strong><p class="bt-caption">Attach to a pitch</p><div class="bt-inline-actions">${pitches.map((pitch)=>`<button class="bt-button bt-button-secondary" data-assign="${pitch.id}">Pitch ${pitch.pitch_number}</button>`).join("")}</div></section>`).join("") : emptyState("No unassigned video", "Every clip is attached to a pitch.") }); sheet.querySelectorAll("[data-assign]").forEach((el)=>el.onclick=async()=>{const clipId=el.closest("[data-unassigned]").dataset.unassigned;const {error}=await supabase.from("video_clips").update({at_bat_pitch_id:el.dataset.assign}).eq("id",clipId);if(error)return showSnackbar("Couldn't attach the video.");sheet.remove();await reload();showSnackbar("Video attached");}); }
function openEditAtBat() { const sheet = openBottomSheet({ title: "Edit at-bat", bodyHtml: `<div class="dev-field"><label>Opponent</label><input id="editOpponent" value="${escapeHtml(entry.opponent ?? "")}"></div><div class="dev-field"><label>Date</label><input type="date" id="editDate" value="${entry.date}"></div>`, footerHtml: '<button class="bt-button bt-button-primary" id="saveAtBat">Save</button>' }); sheet.querySelector("#saveAtBat").onclick = async () => { const patch = { opponent: sheet.querySelector("#editOpponent").value.trim() || null, date: sheet.querySelector("#editDate").value }; const { error } = await supabase.from("game_log_entries").update(patch).eq("id", entryId); if (error) return showSnackbar("Couldn't save the at-bat."); Object.assign(entry, patch); sheet.remove(); location.reload(); }; }
// Clips not loaded -> analysis state unknown (null), never "none analyzed".
function currentSummary() { return L.summarizeAtBat(entry, pitches, clipsLoaded ? clips : null); }
async function saveSummary() { const facts = currentSummary(); if (!L.atBatSummaryComplete(facts)) { showSnackbar("Analysis status couldn't be confirmed - summary not saved."); return; } const summary = L.atBatFactsSummary(facts); const { error } = await supabase.from("game_log_entries").update({ ai_summary: summary, ai_summary_generated_at: new Date().toISOString() }).eq("id", entryId); showSnackbar(error ? "Couldn't save the summary." : "Summary saved"); }
main();
</script></body></html>
