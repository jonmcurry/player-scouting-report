<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HitterLoop — Compare</title>
<link rel="stylesheet" href="./coach.css?v=28f2e5405e"><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#121418">
</head><body><header class="app-bar" id="appBar"></header><main class="wrap wide"><nav id="devTabs"></nav>
<p class="hint" id="loading">Loading swings…</p><div id="content" hidden><section id="suggestions"></section><section id="selection"></section>
<nav class="bt-segmented-tabs bt-compare-tabs" id="modeTabs" hidden aria-label="Comparison mode"><button data-mode="video">Video</button><button data-mode="frames">Frames</button><button data-mode="progress">Progress</button><button data-mode="metrics">Metrics</button></nav>
<section id="modeBody"></section><section id="threeDHost"></section></div></main><div id="compareActions"></div><nav class="bottom-nav" id="bottomNav"></nav>
<script src="./demo.local.js"></script><script src="./config.local.js"></script><script type="module">
import { supabase, qs, escapeHtml } from "./shared.js";
import { isDemoMode } from "./demoConfig.js";
import { L, emptyState, fmtDate, getVideoUrl, videoTimeFor, loadContext, loadObservations, loadPhases, loadPriorities, loadSwingRecords, renderHeader } from "./components/devUi.js";
import { openObservationSheet } from "./components/devActions.js";
import { sharedPhase, suggestedComparePairs } from "./components/comparePairs.js";
import { loadSwingMetrics } from "./components/swingMetricsPanel.js";
import { hasPublishedMetrics } from "./components/playerDevelopmentSummary.js";
import { button, icon, openBottomSheet, showSnackbar, statusChip } from "./components/ui.js";

let ctx, swings = [], priorities = [], suggestions = [], A = null, B = null, mode = "video", phaseSlug = "contact", pickerSelection = [];
const cache = new Map();
// The single spot every "no video element" render decides its message -
// demo mode never has a.url/b.url at all (getVideoUrl() short-circuits
// before ever calling get-video-url, which isn't deployed to the demo
// project), so this is always the demo copy there, never the real
// "Video unavailable" copy production shows for a genuine load failure.
const videoPlaceholderHtml = () => isDemoMode()
  ? '<p class="bt-video-unavailable">No video published for this swing<br><span>The analysis comes from the original footage</span></p>'
  : '<p class="bt-video-unavailable">Video unavailable<br><span>Try again later</span></p>';
const describe = (s) => `${fmtDate(s.date)} · ${s.context === "game" ? `AB ${s.ab}${s.pitchNumber ? ` · Pitch ${s.pitchNumber}` : ""}` : `Rep ${s.repNumber ?? ""}${s.grouping ? ` · ${L.GROUPING_LABELS[s.grouping]}` : ""}`}`;
const swingOrder = (s) => `${s.date}|${String(s.ab ?? 0).padStart(4,"0")}|${String(s.pitchNumber ?? s.repNumber ?? 0).padStart(4,"0")}|${s.createdAt ?? ""}`;
const ordered = (a, b) => swingOrder(a).localeCompare(swingOrder(b)) <= 0 ? [a, b] : [b, a];

async function main() {
  ctx = await loadContext(); if (!ctx) return; await renderHeader(ctx, "compare");
  [swings, priorities] = await Promise.all([loadSwingRecords(ctx.player.id, { limit: 200 }), loadPriorities(ctx.player.id, ["active","monitoring","resolved"])]);
  const requestedPriority = qs("priority");
  suggestions = suggestedComparePairs(swings.map((s) => ({ ...s, priorityTitles: Object.fromEntries(priorities.map((p) => [p.id, p.title])) })), { priorityId: requestedPriority, source: document.referrer.includes("session.html") ? "practice" : document.referrer.includes("development.html") ? "development" : null });
  restore(); wire(); document.getElementById("loading").hidden = true; document.getElementById("content").hidden = false; render();
}
function restore() {
  const ids = [qs("a"), qs("b")]; A = swings.find((s) => s.clipId === ids[0]) ?? null; B = swings.find((s) => s.clipId === ids[1]) ?? null;
  if (A && B) [A, B] = ordered(A, B); phaseSlug = qs("phase") || "contact";
  const requested = qs("mode"); mode = requested === "trend" ? "progress" : requested === "frame" ? "frames" : ["video","frames","progress","metrics"].includes(requested) ? requested : "video";
}
function wire() {
  document.getElementById("modeTabs").onclick = (event) => { const tab = event.target.closest("[data-mode]"); if (!tab) return; mode = tab.dataset.mode; renderMode(); };
  document.addEventListener("visibilitychange", () => { if (document.hidden) document.querySelectorAll("#modeBody video").forEach((video) => video.pause()); });
}
function render() {
  renderSuggestions(); const ready = A && B;
  document.getElementById("modeTabs").hidden = !ready;
  document.getElementById("selection").innerHTML = ready ? `<div class="bt-compare-selection"><button data-replace="a"><span>A</span><strong>${escapeHtml(describe(A))}</strong></button><button class="bt-icon-button" id="swap" aria-label="Swap swings">${icon("repeat", { size: 20 })}</button><button data-replace="b"><span>B</span><strong>${escapeHtml(describe(B))}</strong></button></div>` : "";
  document.getElementById("selection").querySelectorAll("[data-replace]").forEach((el) => el.onclick = () => openPicker(el.dataset.replace));
  document.getElementById("swap")?.addEventListener("click", () => { [A,B] = [B,A]; render(); });
  if (!ready) { document.getElementById("modeBody").innerHTML = swings.length < 2 ? emptyState(swings.length ? "You need two swings to compare" : "No swings to compare yet", "Record a rep or a pitch to start.") : ""; document.getElementById("threeDHost").innerHTML = ""; document.getElementById("compareActions").innerHTML = ""; return; }
  renderMode();
}
function renderSuggestions() {
  const host = document.getElementById("suggestions"); const loaded = A && B;
  if (!suggestions.length) { host.innerHTML = loaded ? `<button class="bt-button bt-button-tertiary" id="manualPick">Choose different swings</button>` : `<section class="bt-card"><h2>Choose two swings</h2>${button("Choose swings manually", { variant: "primary", attrs: 'id="manualPick"' })}</section>`; }
  else {
    const rows = suggestions.map((pair, index) => `<button class="bt-suggestion-row ${index === 0 && !loaded ? "primary" : ""}" data-pair="${index}"><span>${index === 0 ? icon("target", { size: 20 }) : icon("columns-2", { size: 20 })}</span><span><strong>${escapeHtml(pair.label)}</strong><small>${fmtDate(pair.a.date)} → ${fmtDate(pair.b.date)}</small></span>${icon("chevron-right", { size: 20 })}</button>`).join("");
    host.innerHTML = loaded ? `<details class="bt-disclosure"><summary><span>Other comparisons</span></summary><div class="bt-disclosure-body">${rows}<button class="bt-button bt-button-tertiary" id="manualPick">Choose swings manually</button></div></details>` : `<section class="bt-card bt-suggestions"><h2>Suggested comparisons</h2>${rows}<button class="bt-button bt-button-tertiary" id="manualPick">Choose swings manually</button></section>`;
  }
  host.querySelectorAll("[data-pair]").forEach((el) => el.onclick = () => { const pair = suggestions[Number(el.dataset.pair)]; A = pair.a; B = pair.b; phaseSlug = "contact"; render(); });
  host.querySelector("#manualPick")?.addEventListener("click", () => openPicker());
}
function openPicker(replace = null) {
  pickerSelection = replace ? [replace === "a" ? B?.clipId : A?.clipId].filter(Boolean) : [A?.clipId,B?.clipId].filter(Boolean); let source = "all";
  const sheet = openBottomSheet({ title: "Choose swings", className: "bt-full-sheet", bodyHtml: `<div class="bt-picker-source" role="group" aria-label="Swing source">${["all","game","practice"].map((key) => `<button data-source="${key}" aria-pressed="${key === source}">${key === "all" ? "All" : key[0].toUpperCase()+key.slice(1)}</button>`).join("")}</div><div id="pickerList"></div>`, footerHtml: '<button class="bt-button bt-button-primary" id="pickerCompare" disabled>Compare</button>' });
  const draw = () => { const rows = swings.filter((s) => source === "all" || s.context === source); sheet.querySelector("#pickerList").innerHTML = `<div class="bt-list">${rows.map((s) => `<button class="bt-list-row" data-clip="${s.clipId}" ${s.status !== "ready" || s.swung === false ? "disabled" : ""}><span class="bt-list-row-copy"><strong>${escapeHtml(describe(s))}</strong><small>${s.status === "ready" ? "Ready" : escapeHtml(s.status)}</small></span>${pickerSelection.includes(s.clipId) ? statusChip(pickerSelection.indexOf(s.clipId) === 0 ? "active" : "monitoring", { domain: "priority", label: pickerSelection.indexOf(s.clipId) === 0 ? "A" : "B" }) : ""}</button>`).join("")}</div>`; sheet.querySelectorAll("[data-clip]").forEach((el) => el.onclick = () => { if (replace) pickerSelection = [replace === "a" ? el.dataset.clip : A.clipId, replace === "b" ? el.dataset.clip : B.clipId]; else if (pickerSelection.includes(el.dataset.clip)) pickerSelection = pickerSelection.filter((id) => id !== el.dataset.clip); else pickerSelection = [...pickerSelection.slice(-1), el.dataset.clip]; draw(); }); sheet.querySelector("#pickerCompare").disabled = pickerSelection.length !== 2 || pickerSelection[0] === pickerSelection[1]; };
  sheet.querySelectorAll("[data-source]").forEach((el) => el.onclick = () => { source = el.dataset.source; sheet.querySelectorAll("[data-source]").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); draw(); });
  sheet.querySelector("#pickerCompare").onclick = () => { [A,B] = ordered(swings.find((s)=>s.clipId===pickerSelection[0]), swings.find((s)=>s.clipId===pickerSelection[1])); sheet.remove(); render(); }; draw();
}
async function detail(s) {
  if (cache.has(s.clipId)) return cache.get(s.clipId);
  const [phases, metrics, url] = await Promise.all([loadPhases(s.clipId), loadSwingMetrics(s.clipId), getVideoUrl(s.clipId)]);
  const quality = L.analysisQualityLabels(metrics?.analysis_quality ?? L.deriveQualityFromPhases(phases, false)); const row = { phases, metrics, quality, url, clipId: s.clipId }; cache.set(s.clipId,row); return row;
}
async function renderMode() {
  const body=document.getElementById("modeBody"); body.innerHTML='<div class="bt-loading-state">Loading comparison…</div>'; const [a,b]=await Promise.all([detail(A),detail(B)]);
  const available = new Set(["video", "frames"]);
  if (priorities.some((p)=>p.status!=="resolved") || [...(A.priorityIds??[]),...(B.priorityIds??[])].length) available.add("progress");
  if (hasPublishedMetrics(a.metrics) && hasPublishedMetrics(b.metrics)) available.add("metrics");
  if (!available.has(mode)) mode="video";
  document.querySelectorAll("#modeTabs [data-mode]").forEach((tab)=>{tab.hidden=!available.has(tab.dataset.mode);tab.setAttribute("aria-current",String(tab.dataset.mode===mode));});
  if(mode==="video") await renderVideo(body,a,b); else if(mode==="frames") await renderFrames(body,a,b); else if(mode==="progress") await renderProgress(body); else renderMetrics(body,a,b);
  document.getElementById("threeDHost").innerHTML=""; renderProgressAction();
}
async function renderVideo(body,a,b){
  phaseSlug=sharedPhase(a.phases,b.phases,phaseSlug)||"start"; const align=phaseSlug==="start"?null:L.alignAroundPhase(a.phases,b.phases,phaseSlug,0.4);
  body.innerHTML=`<p class="bt-compare-status">${icon("info",{size:16})}<span>${align?`Aligned on ${escapeHtml(L.PHASES.find((p)=>p.slug===phaseSlug)?.label??phaseSlug)}${[a,b].some((d)=>d.phases.find((p)=>p.slug===phaseSlug)?.confidence==="low")?" · estimated on at least one swing":""}`:"No shared phase available · playing from start"}</span><button class="bt-button bt-button-tertiary" id="phaseChoice">Change</button></p><div class="bt-video-compare"><div><span class="bt-ab-chip">A</span>${a.url?`<video id="vA" src="${a.url}" playsinline muted preload="metadata"></video>`:videoPlaceholderHtml()}</div><div><span class="bt-ab-chip">B</span>${b.url?`<video id="vB" src="${b.url}" playsinline muted preload="metadata"></video>`:videoPlaceholderHtml()}</div></div><div class="bt-compare-transport"><button class="bt-icon-button" id="backFrame" aria-label="Previous frame">${icon("chevron-left",{size:22})}</button><button class="bt-button bt-button-secondary" id="playBoth">Play</button><button class="bt-icon-button" id="nextFrame" aria-label="Next frame">${icon("chevron-right",{size:22})}</button><button class="bt-button bt-button-tertiary" id="speed">0.5×</button></div><p class="bt-caption">Original video is the source of truth.</p>`;
  let videos=[body.querySelector("#vA"),body.querySelector("#vB")].filter(Boolean); let rate=.5;
  const starts=()=>align?[align.startA,align.startB]:[0,0]; const side={vA:[0,a],vB:[1,b]}; videos.forEach((v)=>v.addEventListener("loadedmetadata",()=>{const [i,d]=side[v.id]; v.currentTime=videoTimeFor(d.clipId,starts()[i]);},{once:true}));
  const lockTransport=()=>{["playBoth","backFrame","nextFrame","speed"].forEach((id)=>{const el=body.querySelector(`#${id}`); if(el){el.disabled=true; el.setAttribute("aria-disabled","true");}}); body.querySelector("#playBoth").textContent="Play"; body.querySelector("#phaseChoice")?.setAttribute("hidden","");};
  // A URL that exists but won't load (missing object, expired, unsupported) is unavailable too.
  const dropVideo=(v)=>{videos=videos.filter((x)=>x!==v); v.replaceWith(Object.assign(document.createElement("p"),{className:"bt-video-unavailable",innerHTML:"Video unavailable<br><span>Try again later</span>"})); if(!videos.length) lockTransport();};
  videos.forEach((v)=>{v.addEventListener("error",()=>dropVideo(v)); if(v.error) dropVideo(v);});
  if(!videos.length) lockTransport();
  body.querySelector("#playBoth").onclick=()=>{if(!videos.length) return; const playing=videos.some((v)=>!v.paused); videos.forEach((v)=>{v.playbackRate=rate; playing?v.pause():v.play()?.catch?.(()=>{});}); body.querySelector("#playBoth").textContent=playing?"Play":"Pause";};
  const step=(n)=>videos.forEach((v)=>{v.pause();v.currentTime=Math.max(0,v.currentTime+n/30);}); body.querySelector("#backFrame").onclick=()=>step(-1); body.querySelector("#nextFrame").onclick=()=>step(1);
  body.querySelector("#speed").onclick=(e)=>{rate=rate===.25?.5:rate===.5?1:.25;e.currentTarget.textContent=`${rate}×`;videos.forEach((v)=>v.playbackRate=rate);}; body.querySelector("#phaseChoice").onclick=()=>openPhaseSheet(a,b);
}
function openPhaseSheet(a,b){const common=L.PHASES.filter((p)=>a.phases.some((x)=>x.slug===p.slug&&x.timeS!=null)&&b.phases.some((x)=>x.slug===p.slug&&x.timeS!=null)); const sheet=openBottomSheet({title:"Align on",bodyHtml:`<div class="bt-list">${common.map((p)=>`<button class="bt-list-row" data-phase="${p.slug}">${escapeHtml(p.label)}</button>`).join("")||'<p class="bt-supporting">No shared phase is available.</p>'}<button class="bt-list-row" data-phase="start">Start</button></div>`}); sheet.querySelectorAll("[data-phase]").forEach((el)=>el.onclick=()=>{phaseSlug=el.dataset.phase;sheet.remove();renderMode();});}
async function renderFrames(body,a,b){ const common=L.PHASES.filter((p)=>a.phases.some((x)=>x.slug===p.slug&&x.timeS!=null)&&b.phases.some((x)=>x.slug===p.slug&&x.timeS!=null)); const selected=common.some((p)=>p.slug===phaseSlug)?phaseSlug:common[0]?.slug; if(!selected){body.innerHTML=emptyState("No shared phase available","These swings can still be compared in Video mode.");return;} phaseSlug=selected; const frame=(id,label,d)=>`<div><span class="bt-ab-chip">${label}</span>${d.url?`<video id="${id}" src="${d.url}" playsinline muted preload="metadata"></video>`:videoPlaceholderHtml()}</div>`; body.innerHTML=`<div class="bt-phase-chips">${common.map((p)=>`<button data-phase="${p.slug}" aria-pressed="${p.slug===phaseSlug}">${escapeHtml(p.slug==="follow-through"?"Finish":p.label)}</button>`).join("")}</div><div class="bt-video-compare bt-frame-compare">${frame("fA","A",a)}${frame("fB","B",b)}</div><details class="bt-disclosure"><summary><span>Compare two moments in one swing</span></summary><div class="bt-disclosure-body"><p class="bt-supporting">Load → Contact · Plant → Contact · Contact → Finish remain available in each swing’s review.</p></div></details>`; [["fA",a],["fB",b]].forEach(([id,d])=>{const v=body.querySelector(`#${id}`),t=L.phaseTime(d.phases,phaseSlug);v?.addEventListener("loadedmetadata",()=>{v.currentTime=videoTimeFor(d.clipId,t);},{once:true});}); body.querySelectorAll("[data-phase]").forEach((el)=>el.onclick=()=>{phaseSlug=el.dataset.phase;renderMode();}); }
async function renderProgress(body){const pid=qs("priority")||[...(A.priorityIds??[]),...(B.priorityIds??[])][0]||priorities.find((p)=>p.status!=="resolved")?.id; const p=priorities.find((row)=>row.id===pid); if(!p){body.innerHTML=emptyState("No active priority yet","Review a swing and track an observation first.");return;} const observations=await loadObservations([p.id]); const onSwings=observations.filter((o)=>[A.clipId,B.clipId].includes(o.video_clip_id)); body.innerHTML=`<section class="bt-card"><div>${statusChip(p.status,{domain:"priority",label:p.title})}</div><h2>Coach observations</h2>${onSwings.length?`<ul class="bt-progress-list">${onSwings.map((o)=>`<li>${statusChip(o.status,{domain:"progress"})}<span>${fmtDate(o.observed_at)}${o.coach_note?` · “${escapeHtml(o.coach_note)}”`:""}</span></li>`).join("")}</ul>`:'<p class="bt-supporting">No coach notes on these swings yet.</p>'}</section>`;}
function renderMetrics(body,a,b){const rows=L.metricComparison(a.metrics,b.metrics,a.quality,b.quality); const visible=rows.slice(0,6); body.innerHTML=rows.length?`<div class="bt-metric-list">${visible.map(metricRow).join("")}${rows.length>6?`<div id="moreMetrics" hidden>${rows.slice(6).map(metricRow).join("")}</div><button class="bt-button bt-button-tertiary" id="showMetrics">Show all</button>`:""}</div>`:(a.metrics&&b.metrics?emptyState("No reliable measurements for these swings","This footage didn't support measurements worth showing. Compare the video and frames instead."):emptyState("No comparable metrics yet","Metrics appear once both swings finish processing.")); body.querySelector("#showMetrics")?.addEventListener("click",(e)=>{body.querySelector("#moreMetrics").hidden=false;e.currentTarget.remove();});}
function metricRow(row){const value=(v)=>v==null?"—":`${Number(v).toFixed(1)}${row.unit==="°"?"°":row.unit?` ${row.unit}`:""}`;return `<div class="bt-metric-row"><span><strong>${escapeHtml(row.label)}</strong><small>${escapeHtml(row.source)}${row.note?` · ${escapeHtml(row.note)}`:""}</small></span><b>A ${value(row.a)}</b><b>B ${value(row.b)}</b></div>`;}
async function renderProgressAction(){const pid=qs("priority")||[...(A.priorityIds??[]),...(B.priorityIds??[])][0];const priority=priorities.find((p)=>p.id===pid&&p.status!=="resolved");const host=document.getElementById("compareActions");if(!priority){host.innerHTML="";return;}const obs=await loadObservations([priority.id]);if(obs.some((o)=>o.video_clip_id===B.clipId)){host.innerHTML="";return;}host.innerHTML=`<div class="bt-sticky-action-bar">${button("Mark progress from this comparison",{variant:"primary",attrs:'id="markProgress"'})}</div>`;host.querySelector("#markProgress").onclick=()=>openObservationSheet(ctx,priority,{clipId:B.clipId,pitchId:B.pitchId,repId:B.repId,sessionId:B.sessionId,phase:phaseSlug},()=>renderMode());}
main().catch((error)=>{document.getElementById("loading").textContent=`Couldn't load: ${error.message}`;showSnackbar("Couldn't load comparisons. Try again.");});
</script></body></html>
