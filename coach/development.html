<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HitterLoop — Player Development</title>
<link rel="stylesheet" href="./coach.css?v=0feb3f4882">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.svg">
<meta name="theme-color" content="#121418">
</head>
<body>
<header class="app-bar" id="appBar"></header>
<div class="wrap">
  <nav id="devTabs"></nav>
  <p class="hint" id="loading">Loading development summary…</p>
  <div id="content" hidden>
    <div id="nextFocus"></div>

    <div class="p2a-section-head" id="priorityHeading"><h2>Active priorities</h2>
      <button class="bt-button bt-button-tertiary tap-target" id="addPriorityBtn">Add priority</button></div>
    <div id="priorities"></div>

    <section id="findingsSection"><h2 class="p2a-section-label">Observations to review</h2><div id="aiSuggestionsWrap"></div></section>

    <details class="bt-disclosure" id="priorityHistory" hidden><summary><span>Priority history</span><span class="bt-disclosure-chevron"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary><div class="bt-disclosure-body" id="priorityHistoryBody"></div></details>
    <details class="bt-disclosure" id="developmentHistory" hidden><summary><span>Development history</span><span class="bt-disclosure-chevron"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary><div class="bt-disclosure-body"><div id="timelineWrap"></div><button class="bt-button bt-button-tertiary tap-target" id="moreTimeline" hidden>Show earlier</button></div></details>

    <details class="bt-disclosure p2a-insights" id="insightsDrawer" hidden><summary><span>Insights</span><span class="bt-disclosure-chevron"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary>
      <div class="bt-disclosure-body"><h3>Game vs practice</h3><div id="mix"></div>
        <details class="bt-disclosure" id="trendsDrawer"><summary><span>Measured trends over time</span></summary>
          <div class="bt-disclosure-body" id="trendsBody"><p class="bt-supporting">Loading…</p></div></details>
      </div>
    </details>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="./demo.local.js"></script><script src="./config.local.js"></script>
<script type="module">
  import {
    L, supabase, loadContext, renderHeader, loadPriorities, loadObservations, loadDrillLibrary,
    loadDrillAssignments, emptyState, fmtDate, escapeHtml, toast, statusChip, showSnackbar,
  } from "./components/devUi.js";
  import {
    openAddPrioritySheet, openPromoteSheet, openAssignDrillSheet, openObservationSheet, openFollowUpSheet,
    openStatusSheet, reviewIssue,
  } from "./components/devActions.js";
  import { button, errorState, icon, openOverflowMenu } from "./components/ui.js";
  import { developmentFocusModel, transferModel } from "./components/phase2aScreens.js";
  import { removedVideoNote } from "./components/phase1bScreens.js";
  import { DEFAULT_CAPTURE_GUIDANCE, derivePlayerDevelopmentSummary } from "./components/playerDevelopmentSummary.js";
  import { isDemoMode } from "./demoConfig.js";

  let ctx;
  let library = [];
  let timelineLimit = 15;

  async function main() {
    ctx = await loadContext();
    if (!ctx) return;
    await renderHeader(ctx, "development");
    library = await loadDrillLibrary(ctx.team.id);
    await refresh();
    document.getElementById("loading").hidden = true;
    document.getElementById("content").hidden = false;

    document.getElementById("addPriorityBtn").addEventListener("click", () => openAddPrioritySheet(ctx, refresh));
    document.getElementById("moreTimeline").addEventListener("click", async () => { timelineLimit += 20; await renderTimeline(); });
  }

  let state = {};

  async function refresh() {
    try {
      const priorities = await loadPriorities(ctx.player.id);
      const ids = priorities.map((p) => p.id);
      const [observations, assignments, followCtx, aiIssues, checklistResult, removedResult] = await Promise.all([
        loadObservations(ids),
        loadDrillAssignments(ids),
        loadFollowUpContext(),
        loadAiIssues(),
        supabase.from("checklist_scores").select("score, review_status, notes, checkpoints!inner(slug,label,sort_order)").eq("player_id", ctx.player.id).order("sort_order", { referencedTable: "checkpoints" }),
        supabase.rpc("clip_removals_for_player", { p_player_id: ctx.player.id }),
      ]);
      const obsBy = groupBy(observations, "player_priority_id");
      const asgBy = groupBy(assignments, "player_priority_id");
      const removals = new Map((removedResult.data ?? []).map((r) => [r.issue_id, r.removed_by_role]));
      state = { priorities, observations, assignments, obsBy, asgBy, followCtx, aiIssues, removals, checklist: checklistResult.data ?? [] };
      renderNextFocus();
      renderPriorities();
      renderAiSuggestions();
      await Promise.all([renderTimeline(), renderMix()]);
    } catch (e) {
      console.error(e);
      document.getElementById("content").innerHTML = errorState("Couldn't load this", "Check your connection and try again.", '<button class="bt-button bt-button-secondary" onclick="location.reload()">Try again</button>');
    }
  }

  function groupBy(rows, key) {
    const m = new Map();
    for (const r of rows) { if (!m.has(r[key])) m.set(r[key], []); m.get(r[key]).push(r); }
    return m;
  }

  async function loadFollowUpContext() {
    const pid = ctx.player.id;
    const [sess, games, clips] = await Promise.all([
      supabase.from("practice_sessions").select("session_date").eq("player_id", pid).order("session_date", { ascending: false }).limit(30),
      supabase.from("game_log_entries").select("date").eq("player_id", pid).eq("session_type", "game").order("date", { ascending: false }).limit(60),
      supabase.from("video_clips").select("created_at, game_log_entries!inner(player_id)").eq("game_log_entries.player_id", pid).order("created_at", { ascending: false }).limit(200),
    ]);
    return {
      now: new Date(),
      practiceSessionDates: (sess.data ?? []).map((r) => r.session_date),
      gameDates: (games.data ?? []).map((r) => r.date),
      swingDates: (clips.data ?? []).map((r) => r.created_at),
    };
  }

  async function loadAiIssues() {
    const { data } = await supabase
      .from("issues")
      .select("*")
      .eq("player_id", ctx.player.id)
      .neq("review_status", "rejected")
      .order("created_at", { ascending: false })
      .limit(12);
    return data ?? [];
  }

  const progressOf = (p) => L.deriveProgress(state.obsBy.get(p.id) ?? []);

  function renderNextFocus() {
    const progress = Object.fromEntries(state.priorities.map((p) => [p.id, progressOf(p)]));
    const dueIds = state.priorities.filter((p) => L.isFollowUpDue(p, state.followCtx)).map((p) => p.id);
    const nf = developmentFocusModel({ priorities: state.priorities, progressById: progress, dueIds, assignments: state.assignments });
    const summary = derivePlayerDevelopmentSummary({ checklist: state.checklist, priorities: state.priorities, assignments: state.assignments, draftFindings: state.aiIssues, captureGuidance: ctx.player.what_to_check_next });
    document.getElementById("nextFocus").innerHTML = nf
      ? `<section class="bt-card p2a-next-focus" data-focus-id="${nf.priority.id}"><span class="bt-eyebrow">Current Priority</span>
           <h1>${escapeHtml(nf.priority.title)}</h1>
           <p>${escapeHtml(nf.priority.description || "Add a coaching goal when you update this priority.")}</p>
           <div class="p2a-focus-meta">${statusChip(progressOf(nf.priority).status || "active", { domain: progressOf(nf.priority).status ? "progress" : "priority", label: progressOf(nf.priority).status ? null : nf.reason })}
             <span>${icon("target", { size: 18 })}${escapeHtml(nf.assignment?.drill_library?.name || "No drill assigned")}</span></div>
           <div class="p2a-hero-actions">${nf.assignment ? `<a class="bt-button bt-button-primary" href="${ctx.url("session", { start: 1, priority: nf.priority.id })}">Start practice</a>` : '<button class="bt-button bt-button-secondary" data-focus-action="drill">Choose a drill</button>'}
             <button class="bt-button bt-button-tertiary" data-focus-action="progress">Update progress</button></div></section>`
      : `<section class="bt-card bt-unified-development-empty"><span class="bt-eyebrow">Development</span><h1>No Priority confirmed yet</h1><p>${summary.draftFindingCount ? `${summary.draftFindingCount} observation${summary.draftFindingCount === 1 ? " is" : "s are"} waiting for coach review below.` : `${escapeHtml(summary.nextStep || DEFAULT_CAPTURE_GUIDANCE)}`}</p><p class="bt-supporting">A Priority is the one thing ${escapeHtml(ctx.player.name)} works on next. The coach sets it; the Drill and progress tracking follow.</p><div class="p2a-hero-actions"><button class="bt-button bt-button-primary" data-focus-action="add-priority">Set a Priority</button><a class="bt-button bt-button-tertiary" href="${ctx.url("player")}">Back to overview</a></div></section>`;
    document.querySelector("[data-focus-action=progress]")?.addEventListener("click", () => openObservationSheet(ctx, nf.priority, {}, refresh));
    document.querySelector("[data-focus-action=add-priority]")?.addEventListener("click", () => openAddPrioritySheet(ctx, refresh));
    document.querySelector("[data-focus-action=drill]")?.addEventListener("click", () => openAssignDrillSheet(ctx, nf.priority, library, state.asgBy.get(nf.priority.id) ?? [], refresh));
  }

  function priorityCard(p) {
    const obs = state.obsBy.get(p.id) ?? [];
    const asg = (state.asgBy.get(p.id) ?? []).filter((a) => a.active);
    const prog = progressOf(p);
    const due = L.isFollowUpDue(p, state.followCtx);
    const transfer = transferModel(obs);
    const evidence = obs.slice(0, 3).map((o) => {
      const link = o.video_clip_id
        ? `<a href="${ctx.url("review", { clip: o.video_clip_id, ...(o.phase ? { phase: o.phase } : {}) })}">view swing</a>`
        : "";
      return `<li>${fmtDate(o.observed_at)} — ${escapeHtml(L.OBSERVATION_LABELS[o.status])}${o.context ? ` (${o.context})` : ""} ${link}${o.coach_note ? `<div class="hint">“${escapeHtml(o.coach_note)}”</div>` : ""}</li>`;
    }).join("");
    const loop = L.coachingLoop(p, obs, state.asgBy.get(p.id) ?? []);
    const drillName = asg.map((a) => a.drill_library?.name).filter(Boolean).join(", ");
    const nextCheck = p.follow_up_kind ? `${L.followUpLabel(p)}${due ? " · Due now" : ""}` : "No follow-up set";
    return `
    <section class="bt-card p2a-priority-card" data-pid="${p.id}">
      <div class="p2a-priority-head"><button class="p2a-priority-toggle" data-act="toggle" aria-expanded="false">
        <span><strong>${escapeHtml(p.title)}</strong>${statusChip(prog.status || "active", { domain: prog.status ? "progress" : "priority", label: prog.status ? null : "No progress yet" })}</span>
        <small>${escapeHtml(p.description || "No coaching goal added yet")}</small></button>
        <button class="bt-icon-button" aria-label="More actions for ${escapeHtml(p.title)}" data-act="menu">${icon("ellipsis-vertical", { size: 24 })}</button></div>
      <div class="p2a-priority-facts"><span>${icon("target", { size: 17 })}${escapeHtml(drillName || "No drill assigned")}</span>
        <button class="bt-button bt-button-tertiary" data-act="evidence">${obs.length} swing${obs.length === 1 ? "" : "s"}</button></div>
      <div class="p2a-priority-facts"><span>${statusChip(transfer.key === "coach_confirmed" ? (transfer.status || "active") : "active", { domain: transfer.key === "coach_confirmed" ? "progress" : "priority", label: transfer.label })}</span>
        <span class="${due ? "p2a-due" : ""}">${icon("clock", { size: 17 })}${escapeHtml(nextCheck)}</span></div>
      <div class="p2a-priority-detail" hidden>
        <p class="bt-supporting">${escapeHtml(transfer.detail)}</p>
        <div class="p2a-loop">${loop.map((s) => `<span class="${s.state}">${escapeHtml(s.label)}</span>`).join("<i></i>")}</div>
        ${evidence ? `<ul class="p2a-evidence">${evidence}</ul>` : emptyState("No evidence yet", "Update progress from a swing to add evidence.")}
        <button class="bt-button bt-button-secondary" data-act="observe">Update progress</button>
      </div>
    </section>`;
  }

  function renderPriorities() {
    const open = state.priorities.filter((p) => p.status === "active" || p.status === "monitoring");
    const closed = state.priorities.filter((p) => p.status === "resolved");
    const el = document.getElementById("priorities");
    document.getElementById("priorityHeading").hidden = !open.length;
    el.innerHTML = open.map(priorityCard).join("");
    // Secondary history only appears when real history exists - never as another empty state.
    document.getElementById("priorityHistory").hidden = !closed.length;
    document.getElementById("priorityHistoryBody").innerHTML = closed.length ? closed.map((p) => `<div class="dev-row between"><b>${escapeHtml(p.title)}</b><span class="hint">resolved ${fmtDate(p.resolved_at)}</span></div>`).join("") : "";
    el.onclick = (e) => {
      const btn = e.target.closest("[data-act]");
      const card = e.target.closest("[data-pid]");
      if (!btn || !card) return;
      const p = state.priorities.find((x) => x.id === card.dataset.pid);
      const assigned = state.asgBy.get(p.id) ?? [];
      switch (btn.dataset.act) {
        case "toggle": {
          const detail = card.querySelector(".p2a-priority-detail");
          detail.hidden = !detail.hidden;
          btn.setAttribute("aria-expanded", String(!detail.hidden));
          return;
        }
        case "observe": return openObservationSheet(ctx, p, {}, refresh);
        case "evidence": {
          card.querySelector("[data-act=toggle]").click(); return;
        }
        case "menu": return openOverflowMenu({ title: p.title, anchor: btn, items: [
          { label: assigned.some((a) => a.active) ? "Change drill" : "Assign drill", icon: "target", onSelect: () => openAssignDrillSheet(ctx, p, library, assigned, refresh) },
          { label: "Set follow-up", icon: "clock", onSelect: () => openFollowUpSheet(p, refresh) },
          { label: "Change status", icon: "sliders-horizontal", onSelect: () => openStatusSheet(p, refresh) },
        ] });
      }
    };
  }

  function renderAiSuggestions() {
    const promotedIds = new Set(state.priorities.map((p) => p.source_issue_id).filter(Boolean));
    const list = state.aiIssues.filter((i) => !promotedIds.has(i.id));
    const wrap = document.getElementById("aiSuggestionsWrap");
    document.getElementById("findingsSection").hidden = !list.length;
    if (!list.length) { wrap.innerHTML = ""; return; }
    wrap.innerHTML = `<div class="bt-list p2a-findings">` + list.slice(0, 5).map((i) => `
      <div class="bt-list-row" data-iid="${i.id}">${icon("sparkles", { size: 20 })}<span class="bt-list-row-copy">
        <span class="bt-list-row-title">${escapeHtml(i.issue)}</span><span class="bt-list-row-supporting">${i.review_status === "draft" ? "Needs coach review" : "Approved · ready to track"}${i.confidence ? ` · ${escapeHtml(i.confidence)} confidence` : ""}${removedVideoNote(i, state.removals) ? ` · ${escapeHtml(removedVideoNote(i, state.removals))}` : ""}</span></span>
        ${i.review_status === "draft" && i.video_clip_id ? `<a class="bt-button bt-button-secondary" href="${ctx.url("review", { clip: i.video_clip_id, ...(i.phase ? { phase: i.phase } : {}) })}">Review swing</a>` : i.review_status !== "draft" && i.suggest_priority && !i.context_explains_it ? '<button class="bt-button bt-button-secondary" data-a="promote">Track</button>' : ""}
        <button class="bt-icon-button" aria-label="More observation actions" data-a="menu">${icon("ellipsis-vertical", { size: 22 })}</button>
      </div>`).join("") + `</div>`;
    wrap.onclick = async (e) => {
      const b = e.target.closest("[data-a]"); const card = e.target.closest("[data-iid]");
      if (!b || !card) return;
      const issue = state.aiIssues.find((x) => x.id === card.dataset.iid);
      if (b.dataset.a === "promote") openPromoteSheet(ctx, issue, refresh);
      if (b.dataset.a === "menu") openOverflowMenu({ title: "Observation", anchor: b, items: [
        ...(issue.review_status !== "draft" && issue.suggest_priority && !issue.context_explains_it ? [{ label: "Track as priority", icon: "trending-up", onSelect: () => openPromoteSheet(ctx, issue, refresh) }] : []),
        { label: "Dismiss · not an issue", icon: "x", onSelect: async () => {
          const previous = { review_status: issue.review_status, reviewed_by: issue.reviewed_by };
          try {
            await reviewIssue(ctx, issue, "reject"); await refresh();
            showSnackbar("Observation dismissed", { actionLabel: "Undo", onAction: async () => { await supabase.from("issues").update(previous).eq("id", issue.id); await refresh(); } });
          } catch (err) { toast(err.message); }
        } },
      ] });
    };
  }

  async function renderTimeline() {
    const pid = ctx.player.id;
    const ids = state.priorities.map((p) => p.id);
    const titleOf = Object.fromEntries(state.priorities.map((p) => [p.id, p.title]));
    const [games, sessions, history, notes] = await Promise.all([
      supabase.from("game_log_entries").select("id, date, opponent, ab, at_bat_pitches(count), video_clips(status)").eq("player_id", pid).eq("session_type", "game").order("date", { ascending: false }).limit(timelineLimit),
      supabase.from("practice_sessions").select("id, session_date, session_goal, outcome, outcome_note, focus_priority_id, assigned_drill_id, drill_library(name), practice_repetitions(id, game_log_entry_id)").eq("player_id", pid).order("session_date", { ascending: false }).limit(timelineLimit),
      ids.length ? supabase.from("player_priority_status_history").select("*").in("player_priority_id", ids).order("changed_at", { ascending: false }).limit(timelineLimit * 2) : { data: [] },
      Promise.resolve({ data: [] }),
    ]);
    const swingCountByEntry = new Map();
    const entryIds = [...(games.data ?? []).map((g) => g.id), ...(sessions.data ?? []).flatMap((s) => (s.practice_repetitions ?? []).map((r) => r.game_log_entry_id))];
    if (entryIds.length) {
      const { data: clips } = await supabase.from("video_clips").select("game_log_entry_id, status").in("game_log_entry_id", entryIds);
      for (const c of clips ?? []) if (c.status === "ready") swingCountByEntry.set(c.game_log_entry_id, (swingCountByEntry.get(c.game_log_entry_id) ?? 0) + 1);
    }
    const events = L.buildTimeline({
      games: (games.data ?? []).map((g) => ({ id: g.id, date: g.date, opponent: g.opponent, ab: g.ab, swingsAnalyzed: swingCountByEntry.get(g.id) ?? 0 })),
      practiceSessions: (sessions.data ?? []).map((s) => ({
        id: s.id, session_date: s.session_date, outcome: s.outcome, outcome_note: s.outcome_note,
        drillName: s.drill_library?.name ?? null, focusTitle: titleOf[s.focus_priority_id] ?? null,
        swingCount: (s.practice_repetitions ?? []).reduce((n, r) => n + (swingCountByEntry.get(r.game_log_entry_id) ?? 0), 0),
      })),
      priorities: state.priorities.map((p) => ({ title: p.title, description: p.description, first_identified_at: p.first_identified_at })),
      drillAssignments: state.assignments.map((a) => ({ assigned_at: a.assigned_at, drillName: a.drill_library?.name ?? "Drill", priorityTitle: titleOf[a.player_priority_id] })),
      statusHistory: (history.data ?? []).map((h) => ({ ...h, priorityTitle: titleOf[h.player_priority_id] })),
      observations: state.observations.map((o) => ({ ...o, priorityTitle: titleOf[o.player_priority_id] })),
      notes: notes.data ?? [],
    });
    const developmentKinds = new Set(["practice", "priority_created", "drill_assigned", "priority_status", "observation", "comparison"]);
    const relevant = events.filter((event) => developmentKinds.has(event.kind));
    const shown = relevant.slice(0, timelineLimit);
    const wrap = document.getElementById("timelineWrap");
    document.getElementById("developmentHistory").hidden = !shown.length;
    if (!shown.length) {
      wrap.innerHTML = "";
      document.getElementById("moreTimeline").hidden = true;
      return;
    }
    wrap.innerHTML = `<ul class="timeline">${shown.map((e) => {
      const link = e.href ? (e.href.page === "session" ? ctx.url("session", { session: e.href.id }) : ctx.url("atbat", { entry: e.href.id })) : null;
      return `<li class="${e.kind}"><div class="t-date">${fmtDate(e.at)}</div><div class="t-title">${link ? `<a href="${link}">${escapeHtml(e.title)}</a>` : escapeHtml(e.title)}</div>${e.detail ? `<div class="t-detail">${escapeHtml(e.detail)}</div>` : ""}</li>`;
    }).join("")}</ul>`;
    document.getElementById("moreTimeline").hidden = relevant.length <= timelineLimit;
  }

  async function renderMix() {
    const since = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    const [g, p] = await Promise.all([
      supabase.from("game_log_entries").select("id", { count: "exact", head: true }).eq("player_id", ctx.player.id).eq("session_type", "game").gte("date", since),
      supabase.from("practice_sessions").select("id", { count: "exact", head: true }).eq("player_id", ctx.player.id).gte("session_date", since),
    ]);
    // A games-only count is not a development insight; show Insights once practice exists.
    document.getElementById("insightsDrawer").hidden = !p.count;
    document.getElementById("mix").innerHTML = `
      <div class="stats-row" style="grid-template-columns:1fr 1fr;">
        <div class="stat-tile"><span class="stat-label">Games (30 days)</span><div class="stat-value">${g.count ?? 0} <span class="hint">at-bats</span></div></div>
        <div class="stat-tile"><span class="stat-label">Practices (30 days)</span><div class="stat-value">${p.count ?? 0} <span class="hint">sessions</span></div></div>
      </div>`;
  }

  // Robust, direct measurements only (no reconstructed 3D angles) - see L.TREND_METRICS.
  // Lazy: nothing is fetched until the coach opens the drawer.
  let trendsLoaded = false;
  document.getElementById("trendsDrawer").addEventListener("toggle", async (e) => {
    if (!e.target.open || trendsLoaded) return;
    trendsLoaded = true;
    const body = document.getElementById("trendsBody");
    try {
      const { data: clips } = await supabase.from("video_clips")
        .select("id, game_log_entries!inner(date, player_id)").eq("game_log_entries.player_id", ctx.player.id).eq("status", "ready")
        .order("created_at", { ascending: false }).limit(60);
      const ids = (clips ?? []).map((c) => c.id);
      if (!ids.length) { body.innerHTML = emptyState("No analyzed swings yet.", "Trends appear after a few swings have been processed."); return; }
      const [{ data: metrics }, { data: phases }] = await Promise.all([
        supabase.from("video_clip_metrics").select("*").in("video_clip_id", ids),
        supabase.from("swing_phases").select("video_clip_id, time_s, swing_phase_types!inner(slug)").in("video_clip_id", ids).in("swing_phase_types.slug", ["load", "contact"]),
      ]);
      const mBy = new Map((metrics ?? []).map((m) => [m.video_clip_id, m]));
      const tBy = new Map();
      for (const p of phases ?? []) { if (!tBy.has(p.video_clip_id)) tBy.set(p.video_clip_id, {}); tBy.get(p.video_clip_id)[p.swing_phase_types.slug] = p.time_s; }
      const rows = (clips ?? []).filter((c) => mBy.has(c.id)).map((c) => {
        const t = tBy.get(c.id) ?? {};
        return { date: c.game_log_entries.date, clipId: c.id, metrics: mBy.get(c.id), quality: mBy.get(c.id).analysis_quality,
          loadToContactS: t.load != null && t.contact != null ? t.contact - t.load : null };
      });
      const trends = L.robustMetricTrends(rows).filter((t) => t.shown);
      body.innerHTML = trends.length
        ? trends.map(trendCard).join("") + `<p class="hint">Only measurements that are reliable enough are charted. Reconstructed 3D joint angles are intentionally left out - they're estimates from one camera.</p>`
        : emptyState("Not enough measurements yet.", "A trend needs at least two swings with reliable data.");
    } catch (err) { body.innerHTML = emptyState("Couldn't load trends", err.message); }
  });

  function trendCard(t) {
    const vals = t.points.map((p) => p.value);
    const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
    const W = 240, H = 44;
    const xy = t.points.map((p, i) => [4 + (i * (W - 8)) / (t.points.length - 1), H - 6 - ((p.value - min) / span) * (H - 12)]);
    const last = xy[xy.length - 1];
    return `<div class="dev-card"><div class="dev-row between"><b>${escapeHtml(t.label)}</b><span class="hint">${vals.at(-1).toFixed(t.unit === "%" ? 0 : 2)} ${escapeHtml(t.unit)} latest</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${escapeHtml(t.label)} over ${t.points.length} swings">
        <polyline fill="none" stroke="var(--clay)" stroke-width="2" points="${xy.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ")}"/>
        <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="var(--clay)"/></svg>
      <div class="hint">${escapeHtml(fmtDate(t.points[0].date))} → ${escapeHtml(fmtDate(t.points.at(-1).date))} · ${t.points.length} swings</div></div>`;
  }

  main();
</script>
</body>
</html>
