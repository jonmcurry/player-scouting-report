<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic diagram illustrating a level-to-slightly-up bat path through
       the zone, vs. a steep chop - not a photo of any real person. -->
  <circle cx="100" cy="40" r="14" fill="#9ca3af"/>
  <line x1="100" y1="54" x2="100" y2="150" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <path d="M 30 130 C 70 135, 130 110, 175 90" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  <text x="175" y="80" font-size="9" fill="#059669">level → slightly up</text>
  <path d="M 30 90 C 70 110, 100 140, 130 175" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.7"/>
  <text x="70" y="185" font-size="9" fill="#dc2626">steep chop (avoid)</text>
</svg>
