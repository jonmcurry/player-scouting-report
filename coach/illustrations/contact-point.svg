<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic diagram illustrating WHERE contact happens relative to the
       front foot - deep (good) vs. out front/early - not a photo of any
       real person. Replaces extension.svg here specifically - that diagram
       shows arm/leg mechanics but has no ball/plate reference at all, so it
       can't actually show what "deep vs. early" means, the thing this
       checkpoint scores. Deliberately still related to the extension cue
       (same body pose), not contradicting it - just adding the depth
       reference extension.svg never had. -->
  <circle cx="80" cy="50" r="14" fill="#9ca3af"/>
  <line x1="80" y1="64" x2="95" y2="110" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <line x1="95" y1="80" x2="150" y2="72" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <line x1="95" y1="110" x2="115" y2="170" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <!-- deep contact point: good -->
  <circle cx="150" cy="72" r="7" fill="#059669"/>
  <text x="150" y="55" font-size="9" text-anchor="middle" fill="#059669">deep (good)</text>
  <!-- out front: avoid -->
  <circle cx="185" cy="95" r="6" fill="#dc2626" opacity="0.7"/>
  <text x="183" y="118" font-size="9" text-anchor="middle" fill="#dc2626">out front (early)</text>
  <line x1="115" y1="170" x2="115" y2="185" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="115" y="196" font-size="8" text-anchor="middle" fill="#9ca3af">front foot</text>
</svg>
