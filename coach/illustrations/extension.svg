<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic stick-figure illustrating full arm extension over a firm front
       leg at contact ("let it travel" / extension cue) - not a photo of any
       real person. -->
  <circle cx="70" cy="50" r="14" fill="#9ca3af"/>
  <line x1="70" y1="64" x2="90" y2="110" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- extended lead arm, straight -->
  <line x1="90" y1="80" x2="160" y2="70" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="70" r="5" fill="#059669"/>
  <text x="160" y="55" font-size="9" text-anchor="middle" fill="#059669">extended</text>
  <!-- firm front leg, straight -->
  <line x1="90" y1="110" x2="120" y2="170" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <text x="120" y="185" font-size="9" text-anchor="middle" fill="#1d4ed8">firm front leg</text>
  <!-- back leg, bent -->
  <line x1="90" y1="110" x2="60" y2="140" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="140" x2="55" y2="170" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
</svg>
