<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic diagram illustrating the finish: bat wrapped around high near
       the opposite shoulder, weight fully forward, back foot pivoted up on
       the toe - not a photo of any real person. Replaces extension.svg here
       specifically - that diagram shows the EXTENSION-AT-CONTACT pose (arm
       straight, ball still out front), a visually different moment in the
       swing than the finish, which is what this checkpoint actually scores. -->
  <circle cx="110" cy="45" r="14" fill="#9ca3af"/>
  <line x1="110" y1="59" x2="100" y2="110" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- bat wrapped around finish, high near the opposite shoulder -->
  <path d="M 100 80 C 130 60, 100 30, 62 42" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="62" y1="42" x2="42" y2="28" stroke="#b08d57" stroke-width="6" stroke-linecap="round"/>
  <!-- front leg: firm, weight forward -->
  <line x1="100" y1="110" x2="120" y2="170" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <!-- back leg: pivoted up onto the toe -->
  <line x1="100" y1="110" x2="75" y2="150" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <line x1="75" y1="150" x2="68" y2="163" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="188" font-size="9" text-anchor="middle" fill="#059669">weight forward, full finish</text>
</svg>
