  <line x1="70" y1="75" x2="130" y2="75" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="75" x2="150" y2="45" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="45" x2="150" y2="20" stroke="#b08d57" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="75" y2="175" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="125" y2="175" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
</svg>
