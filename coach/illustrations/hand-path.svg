<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic diagram illustrating a direct, short hand path from the load
       position to the ball, vs. a long looping path - not a photo of any
       real person. Same "good path vs. path to avoid" convention as
       bat-path.svg, but for the HANDS specifically, not the bat head -
       distinct checkpoints that happen to look identical without this. -->
  <circle cx="60" cy="150" r="6" fill="#9ca3af"/>
  <text x="60" y="170" font-size="8" text-anchor="middle" fill="#9ca3af">load</text>
  <circle cx="170" cy="100" r="6" fill="#9ca3af"/>
  <text x="170" y="90" font-size="8" text-anchor="middle" fill="#9ca3af">ball</text>
  <path d="M 60 150 C 80 120, 130 105, 170 100" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  <text x="95" y="118" font-size="9" fill="#059669">direct path</text>
  <path d="M 60 150 C 35 100, 90 55, 170 100" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.7"/>
  <text x="45" y="50" font-size="9" fill="#dc2626">looping (avoid)</text>
</svg>
