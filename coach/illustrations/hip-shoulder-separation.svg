<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic, non-identifying stick-figure diagram illustrating the "stretch-
       and-fire" cue: hips already rotated open while shoulders are still
       closed/coiled, showing the separation angle - not a photo of any real
       person, never intended to be. -->
  <circle cx="100" cy="40" r="14" fill="#9ca3af"/>
  <line x1="100" y1="54" x2="100" y2="110" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- shoulders: still closed (facing viewer) -->
  <line x1="70" y1="70" x2="130" y2="70" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <text x="100" y="62" font-size="10" text-anchor="middle" fill="#1d4ed8">shoulders</text>
  <!-- hips: already rotated open -->
  <line x1="80" y1="110" x2="120" y2="118" stroke="#059669" stroke-width="6" stroke-linecap="round" transform="rotate(35 100 114)"/>
  <text x="100" y="128" font-size="10" text-anchor="middle" fill="#059669">hips (open)</text>
  <line x1="100" y1="110" x2="80" y2="170" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="120" y2="170" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <path d="M 100 90 A 24 24 0 0 1 118 100" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="140" y="90" font-size="9" fill="#d97706">separation</text>
</svg>
