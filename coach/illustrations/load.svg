<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic, non-identifying diagram illustrating the "load" - weight
       shifted back onto the back leg, hands/bat coiled back, front leg
       light - not a photo of any real person. Replaces generic-swing.svg
       here specifically because that figure doesn't show any weight shift
       at all, the actual thing this checkpoint scores. -->
  <circle cx="105" cy="40" r="14" fill="#9ca3af"/>
  <line x1="105" y1="54" x2="95" y2="110" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- hands/bat loaded back -->
  <line x1="95" y1="75" x2="115" y2="65" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="115" y1="65" x2="140" y2="80" stroke="#b08d57" stroke-width="6" stroke-linecap="round"/>
  <!-- back leg: weight loaded onto it (thicker, emphasized) -->
  <line x1="95" y1="110" x2="70" y2="168" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
  <!-- front leg: light -->
  <line x1="95" y1="110" x2="125" y2="165" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M 70 175 h 20" stroke="#059669" stroke-width="1.5" fill="none"/>
  <text x="70" y="188" font-size="9" text-anchor="middle" fill="#059669">weight loaded back</text>
</svg>
