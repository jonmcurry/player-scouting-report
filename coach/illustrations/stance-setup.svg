<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic, non-identifying diagram illustrating a balanced, centered
       athletic stance (weight even, not leaning) - not a photo of any real
       person. Replaces generic-swing.svg here specifically because that
       figure is a mid-swing pose, not a pre-pitch ready stance - the wrong
       moment in the swing for this checkpoint. -->
  <circle cx="100" cy="40" r="14" fill="#9ca3af"/>
  <line x1="100" y1="54" x2="100" y2="110" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- bat held up, ready - not swinging -->
  <line x1="100" y1="75" x2="85" y2="55" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="85" y1="55" x2="70" y2="25" stroke="#b08d57" stroke-width="6" stroke-linecap="round"/>
  <!-- legs, even shoulder-width stance -->
  <line x1="100" y1="110" x2="80" y2="170" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="120" y2="170" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="112" x2="100" y2="180" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="100" y="193" font-size="9" text-anchor="middle" fill="#d97706">weight centered, balanced</text>
</svg>
