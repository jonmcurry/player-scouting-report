<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic, non-identifying diagram illustrating a short, controlled
       stride/front-foot plant - not a lunge - not a photo of any real
       person. Replaces generic-swing.svg here specifically because that
       figure is a mid-swing pose that doesn't show a stride length at all,
       the actual thing this checkpoint scores. -->
  <circle cx="95" cy="40" r="14" fill="#9ca3af"/>
  <line x1="95" y1="54" x2="100" y2="110" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="75" x2="70" y2="60" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="70" y1="60" x2="50" y2="80" stroke="#b08d57" stroke-width="6" stroke-linecap="round"/>
  <!-- back leg, still planted -->
  <line x1="100" y1="110" x2="90" y2="170" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <!-- front leg: short, controlled stride to a new landing spot -->
  <line x1="100" y1="110" x2="130" y2="165" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <path d="M 90 178 h 40" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>
  <text x="110" y="192" font-size="9" text-anchor="middle" fill="#d97706">short, controlled - not a lunge</text>
</svg>
