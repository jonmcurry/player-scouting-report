<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Generic strike-zone diagram illustrating "swing at strikes, take
       balls" - not a batting-stance illustration at all, deliberately,
       since pitch selection is a zone-recognition concept, not a swing-
       mechanics one. Replaces generic-swing.svg here specifically because a
       plain batting silhouette doesn't visually communicate anything about
       a decision being made pitch to pitch. -->
  <rect x="60" y="50" width="80" height="100" fill="none" stroke="#9ca3af" stroke-width="3"/>
  <line x1="86.7" y1="50" x2="86.7" y2="150" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="113.3" y1="50" x2="113.3" y2="150" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="60" y1="83.3" x2="140" y2="83.3" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="60" y1="116.7" x2="140" y2="116.7" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="100" y="40" font-size="9" text-anchor="middle" fill="#9ca3af">strike zone</text>
  <!-- a strike: swing -->
  <circle cx="100" cy="100" r="9" fill="#059669"/>
  <path d="M 93 100 l 5 5 l 9 -10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="168" font-size="10" text-anchor="middle" fill="#059669">swing</text>
  <!-- a ball: take -->
  <circle cx="165" cy="70" r="9" fill="#dc2626"/>
  <line x1="160" y1="65" x2="170" y2="75" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="65" x2="160" y2="75" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="165" y="95" font-size="10" text-anchor="middle" fill="#dc2626">take</text>
</svg>
