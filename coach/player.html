<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BarrelIQ — Player View</title>
<link rel="stylesheet" href="./coach.css?v=6">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.svg">
<meta name="theme-color" content="#121418">
</head>
<body>
<header class="app-bar" id="appBar"></header>
<div class="wrap">
  <div id="trendBanner"></div>
  <div class="stats-row" id="statsRow"></div>

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2 style="margin-top:0;">Swing Checklist</h2>
    <span class="hint">11 Checkpoints</span>
  </div>
  <div id="checklistCards"></div>

  <h2>Diagnosis, Comps &amp; Plan</h2>
  <details class="drawer" open>
    <summary><span>Primary Issue(s) Identified</span></summary>
    <div class="drawer-body" id="issuesList"></div>
  </details>
  <details class="drawer">
    <summary><span>Reference Comp — What a Fix Looks Like</span></summary>
    <div class="drawer-body" id="compList"></div>
  </details>
  <details class="drawer">
    <summary><span>Drill Recommendations</span></summary>
    <div class="drawer-body" id="drillList"></div>
  </details>
  <details class="drawer">
    <summary><span>Follow-up</span></summary>
    <div class="drawer-body" id="followUp"></div>
  </details>

  <h2>Game Log</h2>
  <div id="gameLogList"></div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Dev-only, gitignored, silently absent in a real deploy - see coach/config.js -->
<script src="./config.local.js"></script>
<script type="module">
  import { supabase, requireSession, getMyDisplayName, CHECKPOINTS, qs, renderReviewBadge } from "./shared.js";
  import { renderStepper } from "./components/stepper.js";
  import { openCompModal } from "./components/compModal.js";
  import { loadClipSkeletonData, loadExtensionScore, buildExtensionCorrectedFrames, renderSkeletonComparison } from "./components/skeletonComparison.js";
  import { loadSwingMetrics, renderSwingMetricsPanel } from "./components/swingMetricsPanel.js";
  import { uploadRawClip } from "./components/videoUpload.js";
  import { renderPlayerAppBar, renderBottomNav, loadRosterWithProgress, setLastPlayerSlug } from "./components/appShell.js";
  import { renderZonePicker, zoneLabel, outcomeLabel } from "./components/pitchZonePicker.js";

  const MIN_ATBATS_FOR_PATTERN = 3;
  const teamSlug = qs("team");
  const playerSlug = qs("player");

  let coachDisplayName = "Coach";
  let playerId = null;
  let teamId = null;
  // Reference-comp context for "Compare against Reference Comp" (Tier-1
  // live skeleton comparison + Tier-2 static frame snapshot, see
  // compModal.js) - reflects whichever clip most recently rendered
  // successfully, whether from initial page load or an explicit tab
  // switch. Known, accepted limitation: a background poll reloading a
  // DIFFERENT, unrelated game-log entry's already-ready clip can still
  // silently reassign this - fixing that fully would need a per-checkpoint-
  // card reference rather than one shared global, a bigger change not done
  // this pass.
  let firstClipContext = null;
  // extensionScore is per-PLAYER, not per-clip - computed once per
  // loadGameLog() call and reused by every clip's render (including tab
  // switches), instead of re-querying it per clip or per tab click.
  let currentExtensionScore = null;
  // Tracks the active clip ID per game_log_entry_id so the selected tab
  // survives a re-render (e.g. the periodic in-flight-clip poll).
  const activeClipIdByEntry = new Map();
  // Caches each entry's last-fetched clips list (id/status/error_message/
  // clip_slug/position) so switching tabs re-renders from memory instead of
  // a fresh Supabase round trip - refreshed whenever loadGameLog() re-runs.
  const clipsByEntry = new Map();
  // clip id -> its game_log_entry_id, for every clip currently pending/
  // processing (populated in loadClipsForEntry for ALL of an entry's
  // clips, not just the active tab, so a background clip's tab dot still
  // updates live even when a different tab is showing). Read by
  // startStatusPolling() to re-check ONLY these specific clips instead of
  // reloading the whole game log every tick - reloading everything on every
  // poll was a real, reported problem (a visible full-page "microrefresh"
  // every 10s, tearing down and rebuilding every card/canvas on the page
  // even when only one clip anywhere was actually still processing).
  const inFlightClips = new Map();

  async function main() {
    const session = await requireSession();
    if (!session) return;
    coachDisplayName = await getMyDisplayName(session.user.id);

    const { data: player, error } = await supabase
      .from("players")
      .select("id, name, jersey_number, slug, refilm_by, what_to_check_next, teams!inner(id, slug, name)")
      .eq("slug", playerSlug)
      .eq("teams.slug", teamSlug)
      .single();
    if (error || !player) {
      document.getElementById("appBar").innerHTML = `<h1>Player not found (or you don't have access)</h1>`;
      return;
    }
    playerId = player.id;
    teamId = player.teams.id;
    setLastPlayerSlug(teamSlug, playerSlug);

    const { roster, confirmedCount, totalCount } = await loadRosterWithProgress(teamId);
    renderPlayerAppBar(document.getElementById("appBar"), {
      player,
      teamName: player.teams.name,
      teamSlug,
      roster,
      confirmedCount,
      totalCount,
    });

    const reportHref = `./player.html?team=${teamSlug}&player=${playerSlug}`;
    renderBottomNav(document.getElementById("bottomNav"), {
      teamSlug,
      activeTab: "report",
      reportHref,
      logAbHref: `${reportHref}&openLog=1`,
      onLogAbClick: openLogAbModal,
    });

    await loadTrend();
    await loadChecklist();
    await loadIssues();
    await loadCompsAndDrills();
    renderFollowUp(player.refilm_by, player.what_to_check_next);
    await loadGameLog();
    await renderStats();
    wireGameLogDelegation();
    startStatusPolling();
    startElapsedTicker();

    if (qs("openLog") === "1") {
      openLogAbModal();
      history.replaceState(null, "", reportHref);
    }
  }

  /** Only rendered when a real checklist_score_history row shows an actual
   * improvement since the last change - never a fabricated/always-on
   * banner (see the pose3d-skeleton-comparison honesty convention this
   * project follows elsewhere). */
  async function loadTrend() {
    const el = document.getElementById("trendBanner");
    const { data: latestRows } = await supabase
      .from("checklist_score_history")
      .select("score, changed_at, checklist_score_id, checklist_scores!inner(player_id, ai_draft, checkpoints!inner(label))")
      .eq("checklist_scores.player_id", playerId)
      .order("changed_at", { ascending: false })
      .limit(1);
    const latest = latestRows?.[0];
    if (!latest) {
      el.innerHTML = "";
      return;
    }

    const { data: priorRows } = await supabase
      .from("checklist_score_history")
      .select("score")
      .eq("checklist_score_id", latest.checklist_score_id)
      .lt("changed_at", latest.changed_at)
      .order("changed_at", { ascending: false })
      .limit(1);
    const priorScore = priorRows?.[0]?.score ?? latest.checklist_scores.ai_draft;

    if (priorScore == null || latest.score <= priorScore) {
      el.innerHTML = "";
      return;
    }

    el.innerHTML = `
      <div class="trend-banner">
        <div class="trend-icon">📈</div>
        <div>
          <span class="trend-label">Trending Up</span>
          <span class="trend-body">Checkpoint <b>${latest.checklist_scores.checkpoints.label}</b> improved from
            <span class="trend-old">${priorScore}</span> → <span class="trend-new">${latest.score}</span> since last session!</span>
        </div>
      </div>
    `;
  }

  async function renderStats() {
    const { count: abCount } = await supabase
      .from("game_log_entries")
      .select("id", { count: "exact", head: true })
      .eq("player_id", playerId);

    const { data: teamStats } = await supabase.from("team_summary_stats").select("avg_score").eq("team_id", teamId);
    const scores = (teamStats ?? []).map((r) => Number(r.avg_score)).filter((n) => !Number.isNaN(n));
    const teamAvg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : "—";

    const count = abCount ?? 0;
    const statusLabel = count >= MIN_ATBATS_FOR_PATTERN ? "Pattern Ready" : `Early Read (${count}/${MIN_ATBATS_FOR_PATTERN})`;

    document.getElementById("statsRow").innerHTML = `
      <div class="stat-tile">
        <span class="stat-label">Logged ABs</span>
        <div class="stat-value">${count}</div>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Team Avg</span>
        <div class="stat-value accent">${teamAvg}</div>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Status</span>
        <div class="stat-value status">${statusLabel.toUpperCase()}</div>
      </div>
    `;
  }

  /** Flat, always-visible checkpoint cards (ux.md Step 3A) - replaces the
   * earlier collapsible <details> drawers. Tapping a stepper score both
   * saves AND confirms in one tap (see stepper.js) - there's no separate
   * "Confirm Score" step, since the single-tap IS the confirmation. */
  async function loadChecklist() {
    const { data: rows } = await supabase
      .from("checklist_scores")
      .select("id, score, ai_draft, reviewed_by, notes, source, checkpoints!inner(slug, label, sort_order)")
      .eq("player_id", playerId)
      .order("sort_order", { referencedTable: "checkpoints" });

    const container = document.getElementById("checklistCards");
    container.innerHTML = "";
    const bySlug = new Map((rows ?? []).map((r) => [r.checkpoints.slug, r]));

    CHECKPOINTS.forEach((cp, idx) => {
      const row = bySlug.get(cp.slug) ?? {
        id: null,
        score: null,
        ai_draft: null,
        reviewed_by: null,
        notes: "Awaiting video",
        checkpoints: cp,
      };
      const unconfirmed = !!row.id && row.score !== null && !row.reviewed_by;

      const card = document.createElement("div");
      card.className = `checkpoint-card${unconfirmed ? " unconfirmed" : ""}`;
      card.innerHTML = `
        ${unconfirmed ? `<div class="ai-ribbon">🤖 AI Draft — Unconfirmed</div>` : ""}
        <div class="cp-eyebrow">Checkpoint ${String(idx + 1).padStart(2, "0")}</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <h3>${cp.label}</h3>
          ${row.id && row.reviewed_by ? `<span class="verified-pill">✓ Verified</span>` : ""}
        </div>
        ${row.id ? `<div class="stepper-mount"></div>` : ""}
        <p class="cp-notes">${row.notes ?? ""}</p>
        ${
          row.id
            ? `
          <div class="cp-actions">
            <button type="button" class="view-skeleton-btn tap-target" data-comp="${cp.slug}" data-label="${cp.label}">📐 View 3D Skeleton</button>
            <span class="cp-meta">${row.reviewed_by ? `Reviewed by ${row.reviewed_by}` : ""}</span>
          </div>
        `
            : `<p class="hint">Not scored yet</p>`
        }
      `;
      container.appendChild(card);

      if (row.id) {
        const mount = card.querySelector(".stepper-mount");
        renderStepper(mount, row, coachDisplayName, () => loadChecklist());
        card.querySelector("[data-comp]").addEventListener("click", (e) => {
          openCompModal(e.currentTarget.dataset.comp, e.currentTarget.dataset.label, firstClipContext);
        });
      }
    });
  }

  async function loadIssues() {
    const { data: issues } = await supabase
      .from("issues")
      .select("issue, seen_in_at_bats, likely_cause, effect, reviewed_by")
      .eq("player_id", playerId);
    const el = document.getElementById("issuesList");
    if (!issues || issues.length === 0) {
      el.innerHTML = `<p class="hint">No issues logged yet.</p>`;
      return;
    }
    el.innerHTML = issues
      .map(
        (i) => `
      <div class="card">
        <b>${i.issue}</b>
        <p class="hint">${i.seen_in_at_bats}</p>
        <p><b>Likely cause:</b> ${i.likely_cause}</p>
        <p><b>Effect:</b> ${i.effect}</p>
        ${i.reviewed_by ? `<span class="badge confirmed">✓ Verified by ${i.reviewed_by}</span>` : `<span class="badge ai-draft">🤖 AI Draft</span>`}
      </div>
    `,
      )
      .join("");
  }

  async function loadCompsAndDrills() {
    const [{ data: comps }, { data: notes }, { data: drills }] = await Promise.all([
      supabase
        .from("comp_recommendations")
        .select("comp_name, cue")
        .eq("player_id", playerId)
        .order("position"),
      supabase.from("comp_notes").select("note").eq("player_id", playerId).order("position"),
      supabase
        .from("drill_recommendations")
        .select("title, description")
        .eq("player_id", playerId)
        .order("position"),
    ]);

    const compEl = document.getElementById("compList");
    if (!comps || comps.length === 0) {
      compEl.innerHTML = `<p class="hint">Comp cues will be picked once the specific issue is identified from film.</p>`;
    } else {
      const rows = comps
        .map((c) => `<tr><td>${c.comp_name}</td><td>${c.cue}</td></tr>`)
        .join("");
      const notesHtml = (notes ?? [])
        .map((n) => `<p class="comp-note">${n.note}</p>`)
        .join("");
      compEl.innerHTML = `<table class="comp-table"><tbody>${rows}</tbody></table>${notesHtml}`;
    }

    const drillEl = document.getElementById("drillList");
    if (!drills || drills.length === 0) {
      drillEl.innerHTML = `<p class="hint">Drills will be recommended once the primary issue(s) are identified from film.</p>`;
    } else {
      drillEl.innerHTML = `<ul class="drills">${drills
        .map((d) => `<li><b>${d.title}</b> — ${d.description}</li>`)
        .join("")}</ul>`;
    }
  }

  function renderFollowUp(refilmBy, whatToCheckNext) {
    document.getElementById("followUp").innerHTML = `
      <div class="followup-grid">
        <div class="followup-field"><b>Re-film by</b>${refilmBy ?? "TBD"}</div>
        <div class="followup-field"><b>What to check next time</b>${whatToCheckNext ?? "TBD"}</div>
      </div>
    `;
  }

  async function loadGameLog() {
    const { data: logs } = await supabase
      .from("game_log_entries")
      .select("id, date, opponent, ab, pitch, result, pitch_zone, pitch_outcome")
      .eq("player_id", playerId)
      .order("position");
    const el = document.getElementById("gameLogList");
    el.innerHTML = (logs ?? [])
      .map((g) => {
        const zoneBits = [zoneLabel(g.pitch_zone), outcomeLabel(g.pitch_outcome)].filter(Boolean).join(" · ");
        return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <b>${g.date} vs ${g.opponent}, AB ${g.ab}</b>
          <button class="tap-target btn-danger" style="font-size:12px;padding:6px 10px;flex:none;" data-delete-at-bat="${g.id}">🗑 Delete At-Bat</button>
        </div>
        <p class="hint">${g.pitch ?? "—"}${zoneBits ? ` <span style="color:var(--clay);">(${zoneBits})</span>` : ""}</p>
        <p>${g.result}</p>
        <div class="scrubber-mount" data-game-log-entry="${g.id}"></div>
      </div>
    `;
      })
      .join("");

    // extensionScore is the same value for every clip on this player's page -
    // fetch it once here instead of once per clip inside the loop below (a
    // real N+1: a full season's worth of logged at-bats meant re-fetching
    // this identical value dozens of times to render one page). Skip the
    // query entirely when there's nothing to render it for.
    currentExtensionScore = logs && logs.length > 0 ? await loadExtensionScore(playerId) : null;

    // Each entry's clip lookup is independent (writes to its own DOM mount),
    // so run them concurrently rather than one at a time.
    await Promise.all((logs ?? []).map((g) => loadClipsForEntry(g.id, currentExtensionScore)));
  }

  /** A game_log_entries row can have >1 physical clip (e.g. 4 separate
   * pitches filmed as separate files for one at-bat, per this project's own
   * real data - see emily_c.html's AB1 note). Fetches ALL clips for the
   * entry, renders a tab per clip (plus an always-available "Add Pitch"
   * upload) and the currently-active one's contents. */
  async function loadClipsForEntry(gameLogEntryId, extensionScore) {
    const mount = document.querySelector(`.scrubber-mount[data-game-log-entry="${gameLogEntryId}"]`);
    if (!mount) return;

    const { data: clips, error } = await supabase
      .from("video_clips")
      .select("id, status, error_message, clip_slug, position, created_at, claimed_at")
      .eq("game_log_entry_id", gameLogEntryId)
      .order("position");
    if (error) {
      mount.innerHTML = `<p class="hint">⚠ Couldn't load clips: ${error.message}</p>`;
      return;
    }
    clipsByEntry.set(gameLogEntryId, clips ?? []);

    // Register EVERY pending/processing clip for this entry, not just
    // whichever one ends up active - a clip on a tab the coach isn't
    // currently viewing still needs its status dot to update live.
    for (const c of clips ?? []) {
      if (c.status === "pending" || c.status === "processing") {
        inFlightClips.set(c.id, gameLogEntryId);
      }
    }

    if (!clips || clips.length === 0) {
      mount.innerHTML = `
        <div class="upload-control" data-game-log-entry="${gameLogEntryId}">
          <input type="file" accept="video/*" class="tap-target">
          <button class="tap-target" data-attach-video>Attach Video</button>
        </div>
        <p class="hint">Film from directly behind home plate, facing the batter — a camera along the
          baseline or outfield can't reliably pick out the bat.</p>
      `;
      return;
    }

    let activeClipId = activeClipIdByEntry.get(gameLogEntryId);
    let activeClip = clips.find((c) => c.id === activeClipId);
    if (!activeClip) {
      activeClip = clips[0];
      activeClipIdByEntry.set(gameLogEntryId, activeClip.id);
    }

    const tabsHtml = clips
      .map((c) => {
        const isActive = c.id === activeClip.id;
        return `
          <button class="clip-tab-btn tap-target ${isActive ? "active" : ""} status-${c.status}"
                  data-clip-id="${c.id}" data-game-log-entry="${gameLogEntryId}">
            <span class="clip-status-indicator"></span> Pitch ${c.position + 1}
          </button>
        `;
      })
      .join("");

    mount.innerHTML = `
      <div class="clip-tabs-container">
        <div class="clip-tabs">
          ${tabsHtml}
          <button class="clip-tab-btn tap-target add-clip-btn" data-add-clip-for-entry="${gameLogEntryId}"
                  title="Film from directly behind home plate, facing the batter">➕ Add Pitch</button>
        </div>
        <input type="file" accept="video/*" class="add-clip-input" data-game-log-entry="${gameLogEntryId}" style="display:none;">
      </div>
      <div class="active-clip-mount" data-active-clip-mount="${gameLogEntryId}"></div>
    `;

    const activeClipMount = mount.querySelector(`[data-active-clip-mount="${gameLogEntryId}"]`);
    await renderActiveClip(activeClipMount, gameLogEntryId, activeClip, extensionScore);
  }

  /** Renders one clip's status/scrubber/delete-control into clipMount.
   * Takes gameLogEntryId as its own parameter rather than reading it off
   * the clip row - the clips query above doesn't select
   * game_log_entry_id (the caller already has the real id in scope, no
   * need to round-trip it through the row). */
  async function renderActiveClip(clipMount, gameLogEntryId, clip, extensionScore) {
    if (clip.status === "pending" || clip.status === "processing") {
      // Real elapsed time since the worker actually claimed this clip
      // (claimed_at) - NOT clip.created_at, which is the original
      // upload time and never changes on a Retry (uploadQueue.ts's
      // claimClip() resets claimed_at to now() on every claim, including a
      // post-Retry re-claim, but created_at is only ever set once at insert).
      // Using created_at here made a Retry's elapsed counter silently keep
      // counting from the ORIGINAL upload instead of resetting - confirmed
      // directly against a real stuck-looking clip (30+ min shown, only ~19
      // actually reprocessing) before this fix. Not a fabricated percentage
      // either way - there's no real progress fraction available from the
      // pipeline, only pending/processing/ready/failed, so a numeric
      // progress bar would be inventing precision that doesn't exist. The
      // elapsed counter itself ticks client-side only (startElapsedTicker(),
      // no network calls) - it's not what tells this page a clip finished,
      // just visual reassurance that it's alive.
      const since = clip.claimed_at
        ? new Date(clip.claimed_at).getTime()
        : clip.created_at
          ? new Date(clip.created_at).getTime()
          : Date.now();
      clipMount.innerHTML = `
        <p class="hint processing-indicator" data-processing-since="${since}">
          <span class="processing-spinner"></span>
          <span>⏳ Processing video… <span data-elapsed>this can take a minute or more.</span></span>
        </p>
      `;
      return;
    }

    if (clip.status === "failed") {
      // First line only in the visible hint (the full message can be a raw
      // Python traceback - useful for an admin to diagnose, not something to
      // dump on a coach by default); full text stays available in a
      // <details> disclosure for whoever needs it.
      const fullMessage = clip.error_message ?? "unknown error";
      const firstLine = fullMessage.split("\n")[0];
      clipMount.innerHTML = `
        <p class="hint">⚠ Video processing failed: ${firstLine}</p>
        <details class="drawer"><summary><span>Full error details</span></summary>
          <div class="drawer-body"><pre style="white-space:pre-wrap;font-size:11px;">${fullMessage}</pre></div>
        </details>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="tap-target" data-retry-clip="${clip.id}" data-game-log-entry="${gameLogEntryId}">Retry</button>
          <button class="tap-target btn-danger" data-delete-clip="${clip.id}" data-game-log-entry="${gameLogEntryId}">Delete Pitch</button>
        </div>
      `;
      return;
    }

    if (clip.status !== "ready") return;

    const pose3dData = await loadClipSkeletonData(clip.id);
    if (!pose3dData || pose3dData.frames.length === 0) {
      clipMount.innerHTML = `
        <p class="hint">⚠ No 3D swing data available for this clip.</p>
        <button class="tap-target btn-danger" style="margin-top:8px;" data-delete-clip="${clip.id}" data-game-log-entry="${gameLogEntryId}">Delete Pitch</button>
      `;
      return;
    }

    const { data: phaseRows } = await supabase
      .from("swing_phases")
      .select("frame, time_s, confidence, swing_phase_types!inner(slug, label, sort_order)")
      .eq("video_clip_id", clip.id)
      .order("sort_order", { referencedTable: "swing_phase_types" });

    const phases = (phaseRows ?? []).map((r) => ({
      slug: r.swing_phase_types.slug,
      label: r.swing_phase_types.label,
      timeS: r.time_s,
      confidence: r.confidence,
    }));

    const correctedFrames = buildExtensionCorrectedFrames(pose3dData.frames, pose3dData.lead_side, extensionScore);
    const note = !pose3dData.lead_side
      ? "Front-leg side unknown for this clip - showing her real swing only."
      : correctedFrames
        ? null
        : "Extension is already at target, or unscored - showing her real swing only.";

    const canvasContainer = document.createElement("div");
    clipMount.appendChild(canvasContainer);
    renderSkeletonComparison(canvasContainer, { realFrames: pose3dData.frames, correctedFrames, phases, note });

    const metricsRow = await loadSwingMetrics(clip.id);
    if (metricsRow) {
      const metricsMount = document.createElement("div");
      clipMount.appendChild(metricsMount);
      renderSwingMetricsPanel(metricsMount, metricsRow);
    }

    const actionRow = document.createElement("div");
    actionRow.style.cssText = "display:flex;justify-content:flex-end;margin-top:8px;";
    actionRow.innerHTML = `<button class="tap-target btn-danger" data-delete-clip="${clip.id}" data-game-log-entry="${gameLogEntryId}">🗑 Delete Pitch</button>`;
    clipMount.appendChild(actionRow);

    // Reflects whichever clip most recently rendered - see this variable's
    // declaration near the top of this script for the known limitation.
    firstClipContext = { realFrames: pose3dData.frames, phases, leadSide: pose3dData.lead_side, extensionScore };
  }

  /** One delegated listener on the container, attached once - #gameLogList's
   * innerHTML is fully replaced on every loadGameLog() call (including the
   * periodic status-poll refresh below), so per-card listeners would pile
   * up duplicates across refreshes if attached the naive way. */
  function wireGameLogDelegation() {
    document.getElementById("gameLogList").addEventListener("click", async (e) => {
      // Switch tab: re-render from the already-cached clips list (no fresh
      // Supabase round trip, no extensionScore re-fetch) rather than
      // calling loadClipsForEntry() again.
      const tabBtn = e.target.closest(".clip-tab-btn:not(.add-clip-btn)");
      if (tabBtn) {
        const gameLogEntryId = tabBtn.dataset.gameLogEntry;
        const clipId = tabBtn.dataset.clipId;
        const clips = clipsByEntry.get(gameLogEntryId) ?? [];
        const clip = clips.find((c) => c.id === clipId);
        const mount = document.querySelector(`.scrubber-mount[data-game-log-entry="${gameLogEntryId}"]`);
        const activeClipMount = mount?.querySelector(`[data-active-clip-mount="${gameLogEntryId}"]`);
        if (!clip || !activeClipMount) return;

        activeClipIdByEntry.set(gameLogEntryId, clipId);
        mount.querySelectorAll(".clip-tab-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.clipId === clipId);
        });
        activeClipMount.innerHTML = "";
        await renderActiveClip(activeClipMount, gameLogEntryId, clip, currentExtensionScore);
        return;
      }

      // Add Pitch - opens this entry's hidden file input.
      const addBtn = e.target.closest(".add-clip-btn");
      if (addBtn) {
        const gameLogEntryId = addBtn.dataset.addClipForEntry;
        const mount = document.querySelector(`.scrubber-mount[data-game-log-entry="${gameLogEntryId}"]`);
        mount?.querySelector(".add-clip-input")?.click();
        return;
      }

      const attachBtn = e.target.closest("[data-attach-video]");
      if (attachBtn) {
        const control = attachBtn.closest(".upload-control");
        const gameLogEntryId = control.dataset.gameLogEntry;
        const fileInput = control.querySelector("input[type=file]");
        const file = fileInput.files[0];
        if (!file) {
          alert("Choose a video file first.");
          return;
        }
        attachBtn.disabled = true;
        attachBtn.textContent = "Uploading…";
        try {
          await uploadRawClip(gameLogEntryId, file);
          await loadClipsForEntry(gameLogEntryId, currentExtensionScore);
        } catch (err) {
          alert(`Couldn't upload video: ${err.message}`);
          attachBtn.disabled = false;
          attachBtn.textContent = "Attach Video";
        }
        return;
      }

      const retryBtn = e.target.closest("[data-retry-clip]");
      if (retryBtn) {
        retryBtn.disabled = true;
        const gameLogEntryId = retryBtn.dataset.gameLogEntry;
        const { error } = await supabase
          .from("video_clips")
          .update({ status: "pending", error_message: null })
          .eq("id", retryBtn.dataset.retryClip);
        if (error) {
          alert(`Couldn't retry: ${error.message}`);
          retryBtn.disabled = false;
          return;
        }
        await loadClipsForEntry(gameLogEntryId, currentExtensionScore);
        return;
      }

      const deleteBtn = e.target.closest("[data-delete-clip]");
      if (deleteBtn) {
        if (!confirm("Delete this pitch clip and its 3D data? This can't be undone.")) return;
        deleteBtn.disabled = true;
        const clipId = deleteBtn.dataset.deleteClip;
        const gameLogEntryId = deleteBtn.dataset.gameLogEntry;
        const { error } = await supabase.from("video_clips").delete().eq("id", clipId);
        if (error) {
          alert(`Couldn't delete clip: ${error.message}`);
          deleteBtn.disabled = false;
          return;
        }
        if (activeClipIdByEntry.get(gameLogEntryId) === clipId) {
          activeClipIdByEntry.delete(gameLogEntryId);
        }
        await loadClipsForEntry(gameLogEntryId, currentExtensionScore);
        return;
      }

      // Delete At-Bat - removes the whole game_log_entries row. video_clips
      // (and, via ITS OWN cascade, video_clip_pose3d/swing_phases) are all
      // FK'd to game_log_entries ON DELETE CASCADE (see migration
      // 00004_video_clips_and_phases.sql), so every pitch clip and its 3D
      // data for this at-bat is removed in the same operation - no separate
      // per-clip cleanup needed here.
      const deleteAtBatBtn = e.target.closest("[data-delete-at-bat]");
      if (deleteAtBatBtn) {
        if (
          !confirm(
            "Delete this entire at-bat, including every pitch clip and all its 3D data? This can't be undone.",
          )
        )
          return;
        deleteAtBatBtn.disabled = true;
        const gameLogEntryId = deleteAtBatBtn.dataset.deleteAtBat;
        const { error } = await supabase.from("game_log_entries").delete().eq("id", gameLogEntryId);
        if (error) {
          alert(`Couldn't delete at-bat: ${error.message}`);
          deleteAtBatBtn.disabled = false;
          return;
        }
        activeClipIdByEntry.delete(gameLogEntryId);
        clipsByEntry.delete(gameLogEntryId);
        for (const [clipId, entryId] of inFlightClips) {
          if (entryId === gameLogEntryId) inFlightClips.delete(clipId);
        }
        deleteAtBatBtn.closest(".card")?.remove();
      }
    });

    document.getElementById("gameLogList").addEventListener("change", async (e) => {
      const fileInput = e.target.closest(".add-clip-input");
      if (!fileInput) return;
      const gameLogEntryId = fileInput.dataset.gameLogEntry;
      const file = fileInput.files[0];
      if (!file) return;

      const mount = document.querySelector(`.scrubber-mount[data-game-log-entry="${gameLogEntryId}"]`);
      const addBtn = mount?.querySelector(".add-clip-btn");
      if (addBtn) {
        addBtn.disabled = true;
        addBtn.innerHTML = "⏳ Uploading…";
      }
      try {
        await uploadRawClip(gameLogEntryId, file);
        await loadClipsForEntry(gameLogEntryId, currentExtensionScore);
      } catch (err) {
        alert(`Couldn't upload video: ${err.message}`);
        if (addBtn) {
          addBtn.disabled = false;
          addBtn.innerHTML = "➕ Add Pitch";
        }
      }
    });
  }

  /** Poll-based refresh (no Supabase Realtime this pass - see the approved
   * plan's deferred-scope note). Real, reported bug this replaces: the
   * previous version called the full loadGameLog() on every tick, which
   * tears down and rebuilds EVERY card/canvas on the page (a visible
   * full-page "microrefresh" every 10s) even when only one clip anywhere
   * was still processing. Now only the specific in-flight clip ids get
   * re-checked, and only a clip whose status actually changed gets any DOM
   * touched at all - a tab dot updates in place, and the visible panel only
   * re-renders if that clip happens to be the one currently active. */
  function startStatusPolling() {
    setInterval(async () => {
      if (inFlightClips.size === 0) return;
      const clipIds = [...inFlightClips.keys()];
      const { data: freshClips } = await supabase
        .from("video_clips")
        .select("id, status, error_message, clip_slug, position, created_at")
        .in("id", clipIds);

      for (const clip of freshClips ?? []) {
        if (clip.status === "pending" || clip.status === "processing") continue; // still in-flight, nothing changed

        const gameLogEntryId = inFlightClips.get(clip.id);
        inFlightClips.delete(clip.id);

        // Keep the cached clips list (used by tab switching) in sync too.
        const cachedClips = clipsByEntry.get(gameLogEntryId);
        const cachedClip = cachedClips?.find((c) => c.id === clip.id);
        if (cachedClip) Object.assign(cachedClip, clip);

        const mount = document.querySelector(`.scrubber-mount[data-game-log-entry="${gameLogEntryId}"]`);
        if (!mount) continue;

        const tabBtn = mount.querySelector(`.clip-tab-btn[data-clip-id="${clip.id}"]`);
        if (tabBtn) tabBtn.className = tabBtn.className.replace(/status-\S+/, `status-${clip.status}`);

        if (activeClipIdByEntry.get(gameLogEntryId) === clip.id) {
          const activeClipMount = mount.querySelector(`[data-active-clip-mount="${gameLogEntryId}"]`);
          if (activeClipMount) {
            activeClipMount.innerHTML = "";
            await renderActiveClip(activeClipMount, gameLogEntryId, clip, currentExtensionScore);
          }
        }
      }
    }, 10000);
  }

  /** Ticks the "N:NN elapsed" label on every currently-rendered processing
   * indicator, purely client-side (no network call) - separate from
   * startStatusPolling()'s actual status re-check above. Runs constantly;
   * a no-op when nothing on the page is processing. */
  function startElapsedTicker() {
    setInterval(() => {
      document.querySelectorAll("[data-processing-since]").forEach((el) => {
        const since = Number(el.dataset.processingSince);
        const elapsedSec = Math.max(0, Math.floor((Date.now() - since) / 1000));
        const mins = Math.floor(elapsedSec / 60);
        const secs = elapsedSec % 60;
        const label = el.querySelector("[data-elapsed]");
        if (label) label.textContent = `${mins}:${String(secs).padStart(2, "0")} elapsed - this can take a minute or more.`;
      });
    }, 1000);
  }

  /** Log AB (ux.md Step 2/3B) - opened from the bottom nav's "+" button
   * instead of living inline in the page, so logging a new at-bat doesn't
   * push the whole checklist/game-log down every time it's not in use. */
  function openLogAbModal() {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <button type="button" class="close-btn tap-target">✕</button>
        <h2 style="margin-top:0;">Log New At-Bat</h2>
        <p class="hint">Tap a zone for the pitch location, then an outcome - both save as real structured fields.
          The pitch field below stays freeform for anything a fixed grid can't capture (pitch type, count, etc).</p>
        <div class="zone-picker-mount"></div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
          <input type="text" id="newDate" placeholder="Date (YYYY-MM-DD)">
          <input type="text" id="newOpponent" placeholder="Opponent">
          <input type="text" id="newAb" placeholder="AB #">
          <input type="text" id="newPitch" placeholder="Pitch type/context (optional, e.g. &quot;Rise ball&quot;)">
          <input type="text" id="newResult" placeholder="Result">
          <label class="hint" for="newVideo">Video (optional) — processing starts automatically after upload.
            Film from directly behind home plate, facing the batter — a camera along the baseline or
            outfield can't reliably pick out the bat.</label>
          <input type="file" id="newVideo" accept="video/*">
          <button class="primary tap-target" id="addAtBatBtn">Add At-Bat</button>
          <p class="hint" id="addAtBatStatus"></p>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.querySelector(".close-btn").addEventListener("click", () => backdrop.remove());
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) backdrop.remove();
    });

    let pitchState = { zone: null, outcome: null };
    renderZonePicker(backdrop.querySelector(".zone-picker-mount"), {
      onChange: (s) => {
        pitchState = s;
      },
    });

    backdrop.querySelector("#addAtBatBtn").addEventListener("click", async () => {
      const date = backdrop.querySelector("#newDate").value.trim();
      const opponent = backdrop.querySelector("#newOpponent").value.trim();
      const ab = Number(backdrop.querySelector("#newAb").value);
      const pitch = backdrop.querySelector("#newPitch").value.trim() || null;
      const result = backdrop.querySelector("#newResult").value.trim();

      if (!date || !opponent || !ab || !result) {
        alert("Date, opponent, AB #, and result are required.");
        return;
      }

      const { count } = await supabase
        .from("game_log_entries")
        .select("id", { count: "exact", head: true })
        .eq("player_id", playerId);

      const { data: newEntry, error } = await supabase
        .from("game_log_entries")
        .insert({
          player_id: playerId,
          date,
          opponent,
          ab,
          pitch,
          result,
          pitch_zone: pitchState.zone,
          pitch_outcome: pitchState.outcome,
          position: count ?? 0,
        })
        .select("id")
        .single();
      if (error || !newEntry) {
        alert(`Couldn't save at-bat: ${error?.message}`);
        return;
      }

      const videoFile = backdrop.querySelector("#newVideo").files[0];
      const statusEl = backdrop.querySelector("#addAtBatStatus");
      let closeDelay = 0;
      if (videoFile) {
        statusEl.textContent = "Uploading video…";
        closeDelay = 1200;
        try {
          await uploadRawClip(newEntry.id, videoFile);
          statusEl.textContent = "Video uploaded - processing will start automatically.";
        } catch (err) {
          statusEl.textContent = `⚠ At-bat saved, but video upload failed: ${err.message}`;
        }
      }

      await loadGameLog();
      await renderStats();
      setTimeout(() => backdrop.remove(), closeDelay);
    });
  }

  main();
</script>
</body>
</html>
