<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HitterLoop — Review</title><link rel="stylesheet" href="./coach.css?v=86c225d02a"><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#121418">
</head><body>
<header class="app-bar" id="appBar"></header><main class="wrap"><div id="queueState"><div class="bt-skeleton-row"></div><div class="bt-skeleton-row"></div><div class="bt-skeleton-row"></div></div></main><nav class="bottom-nav" id="bottomNav"></nav>
<script src="./demo.local.js"></script><script src="./config.local.js"></script><script type="module">
import { supabase, requireSession, qs, escapeHtml } from "./shared.js";
import { loadRosterWithProgress, renderDrillInAppBar, renderBottomNav } from "./components/appShell.js";
import { buildReviewQueue } from "./components/reviewQueue.js";
import { button, disclosure, emptyState, errorState, icon, listRow } from "./components/ui.js";
import { fmtDate } from "./components/devUi.js";

const teamSlug = qs("team");
const href = (clipId, playerSlug, queue = false) => `./review.html?${new URLSearchParams({ team: teamSlug, player: playerSlug ?? "", clip: clipId, ...(queue ? { queue: "1" } : {}) })}`;
const contextLabel = (item) => item.entry.session_type === "practice"
  ? `${fmtDate(item.entry.date)} · Practice · Rep ${item.rep?.rep_number ?? ""}`
  : `${fmtDate(item.entry.date)} · AB ${item.entry.ab ?? ""}${item.pitch?.pitch_number ? ` · Pitch ${item.pitch.pitch_number}` : ""}`;

async function main() {
  if (!await requireSession()) return;
  const { data: team, error: teamError } = await supabase.from("teams").select("id,name").eq("slug", teamSlug).single();
  if (teamError || !team) return renderError("This team wasn't found.");
  renderDrillInAppBar(document.getElementById("appBar"), { title: "Review", backHref: `./team.html?team=${encodeURIComponent(teamSlug)}`, backLabel: `Back to ${team.name}` });
  const { roster } = await loadRosterWithProgress(team.id);
  renderBottomNav(document.getElementById("bottomNav"), { teamSlug, activeTab: "queue", roster });
  const { data, error } = await supabase.from("issues").select(`id,issue,review_status,created_at,video_clip_id,player_id,
    players!inner(id,name,slug,jersey_number,team_id),
    video_clips(id,status,game_log_entries(date,ab,session_type),at_bat_pitches(pitch_number),practice_repetitions(rep_number,grouping))`)
    .eq("players.team_id", team.id).order("created_at", { ascending: true });
  if (error) return renderError("Couldn't load the review queue.", error.message);
  const normalized = (data ?? []).map((row) => ({ ...row, player: row.players, video_clip: row.video_clips ? { ...row.video_clips, game_log_entries: { ...(row.video_clips.game_log_entries ?? {}), players: row.players } } : null }));
  render(buildReviewQueue(normalized));
}

function render(model) {
  const host = document.getElementById("queueState");
  const groups = model.groups.map((group) => `<section class="bt-queue-group"><div class="bt-section-label"><span><span class="jersey-badge xs">${escapeHtml(group.player.jersey_number ?? "")}</span> ${escapeHtml(group.player.name)}</span><span>${group.swings.length} swing${group.swings.length === 1 ? "" : "s"}</span></div><div class="bt-list">${group.swings.map((item) => listRow({ href: href(item.clipId, group.player.slug, true), title: contextLabel(item), supporting: item.partial ? `${item.decidedCount} of ${item.totalCount} reviewed` : `${item.draftCount} finding${item.draftCount === 1 ? "" : "s"} to review`, trailing: icon("chevron-right", { size: 20 }), ariaLabel: `${group.player.name}, ${contextLabel(item)}, ${item.draftCount} findings to review` })).join("")}</div></section>`).join("");
  const intro = model.next ? `<p class="bt-supporting">${model.pendingSwingCount} swing${model.pendingSwingCount === 1 ? "" : "s"} to review · ${model.playerCount} player${model.playerCount === 1 ? "" : "s"}</p>${button(`Start with ${model.next.player.name} · ${contextLabel(model.next)}`, { variant: "primary", className: "p1b-full-button", attrs: `id="startReview"` })}` : emptyState("You're all caught up", "New swings show up here after they're analyzed.", "", "circle-check");
  const orphan = model.orphanDraftCount ? `<a class="bt-list-row bt-muted-row" href="./team.html?team=${encodeURIComponent(teamSlug)}"><span class="bt-list-row-copy"><span class="bt-list-row-title">Older findings without a swing</span><span class="bt-list-row-supporting">${model.orphanDraftCount} finding${model.orphanDraftCount === 1 ? "" : "s"} · open a player’s Development page</span></span>${icon("chevron-right", { size: 20 })}</a>` : "";
  const reviewed = model.reviewed.length ? disclosure("Reviewed (last 5)", `<div class="bt-list">${model.reviewed.map((item) => listRow({ href: href(item.clipId, item.player.slug), title: `${item.player.name} · ${contextLabel(item)}`, supporting: "Reviewed", trailing: icon("chevron-right", { size: 20 }) })).join("")}</div>`) : "";
  host.innerHTML = `<section class="bt-card bt-queue-summary">${intro}</section>${groups}${orphan}${reviewed}`;
  document.getElementById("startReview")?.addEventListener("click", () => location.href = href(model.next.clipId, model.next.player.slug, true));
}
function renderError(title, detail = "Try again.") { document.getElementById("queueState").innerHTML = errorState(title, detail, '<button class="bt-button bt-button-primary" onclick="location.reload()">Try again</button>'); }
main();
</script></body></html>
