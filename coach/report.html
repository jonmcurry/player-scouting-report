<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HitterLoop — Player Report</title>
<link rel="stylesheet" href="./coach.css?v=b54d43259c"><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#121418">
</head><body class="bt-public-report"><div class="bt-report-brand">HitterLoop</div><main class="wrap"><div id="reportRoot"><div class="bt-report-skeleton"><div></div><div></div><div></div></div></div></main>
<script src="./demo.local.js"></script><script src="./config.local.js"></script><script type="module">
import { supabase, qs, escapeHtml } from "./shared.js";
import { isDemoMode } from "./demoConfig.js";
import { icon } from "./components/ui.js";
const root=document.getElementById("reportRoot"),token=qs("token");
const scoreWord=(score,state)=>state==="insufficient_evidence"?"Insufficient evidence":({3:"On Target",2:"Developing",1:"Needs Work"}[score]??"");
// The ONE branch on demo mode this page needs: which Edge Function to call.
// get-demo-player-report is the schema-isolated counterpart of
// get-player-report (queries demo.* instead of public.*, never both) - see
// supabase/functions/get-demo-player-report/index.ts. Everything else
// about this page - rendering, video handling, error states - is
// completely unchanged between the two modes.
const reportFunction = isDemoMode() ? "get-demo-player-report" : "get-player-report";

async function main(){
  if(!token)return invalid();
  let response;
  try{response=await supabase.functions.invoke(reportFunction,{body:{token}});}catch{return network();}
  if(response.error&&!response.data){const status=response.error?.context?.status;if(status>=400&&status<500)return invalid();return network();}
  if(!response.data||response.data.error)return invalid();
  render(response.data);
}
function invalid(){root.innerHTML='<section class="bt-report-state"><h1>This link isn’t available</h1><p>Ask your coach for a new link.</p></section>';}
function network(){root.innerHTML='<section class="bt-report-state"><h1>Couldn’t load</h1><p>Check your connection.</p><button class="bt-button bt-button-primary" id="retryReport">Try again</button></section>';document.getElementById("retryReport").onclick=main;}
function render(data){
  const priorities=data.priorities??[],focus=priorities.find((p)=>p.status!=="resolved")??null,others=priorities.filter((p)=>p!==focus),drill=focus?.drills?.[0]??null;
  const progress=focus?.progress??[],strengths=data.strengths??[],clips=focus?.clips??[];
  root.innerHTML=`<header class="bt-report-player">${isDemoMode()?`<span class="jersey-badge lg">${escapeHtml(data.jerseyNumber??"")}</span>`:""}<div><h1>${escapeHtml(data.playerName)}</h1>${isDemoMode()?`<p>${escapeHtml(data.teamName??"")}</p>`:""}</div></header>
    <section><h2>What’s going well</h2>${strengths.length||priorities.some((p)=>p.status==="resolved")?`<ul class="bt-strengths">${strengths.map((item)=>`<li>${icon("check",{size:18})}<span>${escapeHtml(typeof item === "string" ? item : item.note || item.label)}</span></li>`).join("")}${priorities.filter((p)=>p.status==="resolved").map((p)=>`<li>${icon("check",{size:18})}<span>Got it: ${escapeHtml(p.title)}</span></li>`).join("")}</ul>`:'<p>Strengths will appear here as your coach reviews more swings.</p>'}</section>
    ${focus ? `<section class="bt-card bt-report-focus"><span class="bt-eyebrow">Current Priority</span><div class="bt-report-title-row"><h2>${escapeHtml(focus.title)}</h2><span class="bt-public-status">${escapeHtml(focus.statusLabel)}</span></div>${focus.why?`<p>${escapeHtml(focus.why)}</p>`:""}</section>
    <section class="bt-card bt-report-next"><span class="bt-eyebrow">Next step</span>${focus?.nextCheck?`<h2>${escapeHtml(focus.nextCheck)}</h2>`:`<h2>${escapeHtml(data.nextStep || "Your coach will review more swing video.")}</h2>${data.nextStep ? "" : "<p>The most useful next video shows the whole body and the bat all the way through contact.</p>"}`}</section>
    <section class="bt-card"><span class="bt-eyebrow">Drill</span>${drill?`<h3>${escapeHtml(drill.name)}</h3>${drill.purpose?`<p>${escapeHtml(drill.purpose)}</p>`:""}<details class="bt-disclosure"><summary><span>How to do it</span></summary><div class="bt-disclosure-body">${drill.instructions?`<p>${escapeHtml(drill.instructions)}</p>`:""}${drill.equipment?`<p><strong>Equipment:</strong> ${escapeHtml(drill.equipment)}</p>`:""}${drill.coachNote?`<p><strong>Coach:</strong> “${escapeHtml(drill.coachNote)}”</p>`:""}</div></details>`:'<h2>No Drill picked yet.</h2><p>Your coach chooses a Drill for this Priority. HitterLoop can recommend one for your coach to choose.</p>'}</section>
    ${progress.length?`<section><h2>Progress</h2><ol class="bt-report-timeline">${progress.map((item)=>`<li><time>${escapeHtml(item.date)}</time><strong>${escapeHtml(item.label)}</strong>${item.note?`<p>“${escapeHtml(item.note)}”</p>`:""}</li>`).join("")}</ol></section>`:'<section><h2>Progress</h2><p>No progress check yet. It appears here after your coach checks a later swing against this Priority.</p></section>'}`
      // No Priority: one card instead of four empty ones. No Priority, Drill or progress is claimed, and no
      // reason is given for the missing Priority that the data does not establish.
      : `<section class="bt-card bt-report-next"><span class="bt-eyebrow">What to work on next</span><h2>Your coach hasn’t picked a Priority yet.</h2><p>${escapeHtml(data.nextStep || "The most useful next video shows the whole body and the bat all the way through contact.")}</p><p class="bt-supporting">A Priority is the one thing to work on next. Once your coach picks one, the Drill and progress show up here. No progress claim yet.</p></section>`}
    ${others.length?`<section><h2>Also working on</h2>${others.map((p)=>`<details class="bt-disclosure"><summary><span>${p.status==="resolved"?"Got it: ":""}${escapeHtml(p.title)}</span><span class="bt-public-status">${escapeHtml(p.statusLabel)}</span></summary><div class="bt-disclosure-body">${p.why?`<p>${escapeHtml(p.why)}</p>`:""}</div></details>`).join("")}</section>`:""}
    ${clips.length?`<section><h2>Watch swing</h2><div class="bt-list">${clips.slice(0,3).map((clip)=>`<button class="bt-list-row" data-clip="${escapeHtml(clip.clipId)}" aria-label="Watch swing from ${escapeHtml(clip.date)}${clip.phase?`, ${escapeHtml(clip.phase)}`:""}"><span>${icon("video",{size:20})}</span><span class="bt-list-row-copy"><strong>${escapeHtml(clip.date)}</strong><small>${escapeHtml(clip.phase??"Swing")}</small></span></button>`).join("")}</div><div id="reportVideo"></div></section>`:""}
    ${(data.checkpoints??[]).length?`<details class="bt-disclosure bt-report-checklist"><summary><span>Full swing checklist</span></summary><div class="bt-disclosure-body"><ul>${data.checkpoints.map((cp)=>`<li><span>${escapeHtml(cp.label)}</span><strong>${scoreWord(cp.score,cp.state)}</strong></li>`).join("")}</ul></div></details>`:""}
    <footer>${isDemoMode() ? "AI helped prepare drafts. " : ""}Only coach-reviewed conclusions appear in this report. Shared by your coach with HitterLoop · Read-only</footer>`;
  root.querySelectorAll("[data-clip]").forEach((button)=>button.onclick=()=>loadVideo(button));
}
async function loadVideo(button){button.disabled=true;let response;try{response=await supabase.functions.invoke(reportFunction,{body:{token,videoClipId:button.dataset.clip}});}catch{}button.disabled=false;const host=document.getElementById("reportVideo");if(!response?.data?.url){host.innerHTML='<p>Video unavailable. <button class="bt-button bt-button-tertiary" id="reloadVideo">Reload to try again</button></p>';host.querySelector("#reloadVideo").onclick=()=>loadVideo(button);return;}host.innerHTML=`<video src="${escapeHtml(response.data.url)}" controls playsinline preload="metadata"></video>`;host.querySelector("video").addEventListener("error",()=>{host.innerHTML='<p>Video unavailable. <button class="bt-button bt-button-tertiary" id="reloadVideo">Reload to try again</button></p>';host.querySelector("#reloadVideo").onclick=()=>loadVideo(button);},{once:true});}
main();
</script></body></html>
