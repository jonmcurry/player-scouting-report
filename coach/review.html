<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HitterLoop — Review Swing</title>
<link rel="stylesheet" href="./coach.css?v=f5273d438e">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.svg">
<meta name="theme-color" content="#121418">
</head>
<body>
<header class="app-bar" id="appBar"></header>
<div class="wrap wide bt-review-page">
  <p class="bt-caption" id="queueCaption" hidden></p>
  <p class="hint" id="loading">Loading swing…</p>
  <div id="content" hidden>
    <div class="bt-review-primary">
      <div class="bt-review-media"><div id="swingHeader"></div><div id="watch"></div></div>
      <div class="bt-review-coaching"><section id="reviewSummary" aria-labelledby="swingReviewTitle"></section><div id="observations"></div><div id="verifiedSummary"></div><div id="evidenceNeeds"></div><div id="workOn"></div><div id="lookFor"></div><div id="track"></div></div>
    </div>
    <details class="bt-disclosure p1b-advanced" id="advancedAnalysis"><summary><span>Advanced analysis</span><span id="qualityChip"></span><span class="bt-disclosure-chevron"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary><div class="bt-disclosure-body">
      <details class="bt-disclosure" id="quality"><summary><span>Analysis quality</span><span class="bt-disclosure-chevron"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary><div class="bt-disclosure-body" id="qualityBody"></div></details>
      <details class="bt-disclosure" id="metricsDrawer" hidden><summary><span>Measurements</span><span class="bt-disclosure-chevron"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary><div class="bt-disclosure-body" id="metricsBody"></div></details>
      <details class="bt-disclosure" id="advanced"><summary><span>Detailed checklist</span><span class="bt-disclosure-chevron"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary><div class="bt-disclosure-body" id="advancedBody"></div></details>
    </div></details>
  </div>
</div>
<div id="queueAction"></div>

<script src="./demo.local.js"></script><script src="./config.local.js"></script>
<script type="module">
  import {
    L, supabase, qs, buildContext, PLAYER_SELECT, loadPriorities,
    loadDrillLibrary, loadDrillAssignments, loadPhases, getVideoUrl, videoTimeFor, emptyState, pill, fmtDate, escapeHtml, showNotFound, toast,
  } from "./components/devUi.js";
  import {
    openPromoteSheet, openAssignDrillSheet, openObservationSheet, openEditIssueSheet, reviewIssue,
  } from "./components/devActions.js";
  import { getMyDisplayName, requireSession } from "./shared.js";
  import { isDemoMode } from "./demoConfig.js";
  import { loadSwingMetrics, renderSwingMetricsPanel } from "./components/swingMetricsPanel.js";
  import { invalidateReviewCount, renderDrillInAppBar } from "./components/appShell.js";
  import { button, card, icon, openOverflowMenu, showSnackbar, statusChip } from "./components/ui.js";
  import { findingActionState, reviewSummary } from "./components/phase1bScreens.js";
  import { buildReviewQueue, findingSequence, queueRemaining } from "./components/reviewQueue.js";
  import { derivePlayerDevelopmentSummary, hasPublishedMetrics, reviewFindingState } from "./components/playerDevelopmentSummary.js";
  import { unionBox, wireZoomToggle, zoomPreferred, zoomToggleHtml } from "./components/subjectZoom.js";

  const clipId = qs("clip");
  const queueMode = qs("queue") === "1";
  document.body.classList.toggle("queue-mode", queueMode);
  let ctx, clip, phases = [], videoEl = null, library = [], priorities = [], assignments = [], issues = [], playerChecklist = [], latestAnalysisRun = null, queueModel = null;

  async function main() {
    const session = await requireSession();
    if (!session) return;
    if (!clipId) return showNotFound("No swing selected.");
    const { data, error } = await supabase
      .from("video_clips")
      .select(`id, status, error_message, clip_slug, game_log_entry_id, at_bat_pitch_id, practice_repetition_id,
        game_log_entries!inner(id, date, opponent, ab, session_type, result, players!inner(${PLAYER_SELECT})),
        at_bat_pitches(id, pitch_number, pitch_outcome, swung), practice_repetitions(id, rep_number, grouping, practice_session_id)`)
      .eq("id", clipId)
      .single();
    if (error || !data) return showNotFound("This swing wasn't found or you don't have access to it.");
    clip = data;
    ctx = buildContext(session, await getMyDisplayName(session.user.id), data.game_log_entries.players);
    const e = clip.game_log_entries;
    const compactTitle = `${ctx.player.name} · ${fmtDate(e.date)} · ${e.session_type === "game" ? `AB ${e.ab}${clip.at_bat_pitches?.pitch_number ? ` · Pitch ${clip.at_bat_pitches.pitch_number}` : ""}` : `Rep ${clip.practice_repetitions?.rep_number ?? ""}`}`;
    renderDrillInAppBar(document.getElementById("appBar"), { title: compactTitle, backHref: queueMode ? `./queue.html?team=${encodeURIComponent(ctx.teamSlug)}` : ctx.url("player"), backLabel: queueMode ? "Back to review queue" : `Back to ${ctx.player.name}`, overflowItems: [
      { label: e.session_type === "game" ? "Open at-bat" : "Open practice", icon: "layout-list", onSelect: () => location.href = e.session_type === "game" ? ctx.url("atbat", { entry: e.id }) : ctx.url("session", { session: clip.practice_repetitions?.practice_session_id ?? "" }) },
      { label: "Compare swings", icon: "columns-2", onSelect: () => location.href = ctx.url("compare", { a: clipId }) },
      ...(queueMode ? [{ label: "Skip for now", icon: "chevron-right", onSelect: skipCurrent }] : []),
    ] });

    const checklistRequest = supabase.from("checklist_scores").select("score, review_status, notes, checkpoints!inner(slug, label, sort_order)").eq("player_id", ctx.player.id).order("sort_order", { referencedTable: "checkpoints" });
    const [loadedPhases, loadedLibrary, loadedPriorities, checklistResult] = await Promise.all([loadPhases(clipId), loadDrillLibrary(ctx.team.id), loadPriorities(ctx.player.id, ["active", "monitoring"]), checklistRequest]);
    phases = loadedPhases; library = loadedLibrary; priorities = loadedPriorities; playerChecklist = checklistResult.data ?? [];
    assignments = await loadDrillAssignments(priorities.map((p) => p.id));
    await loadIssues();

    renderHeaderBlock();
    await renderWatch();
    renderAll();
    wireDetails();
    document.getElementById("loading").hidden = true;
    document.getElementById("content").hidden = false;
    seekToPhase(qs("phase"));
  }

  async function loadIssues() {
    const [{ data }, { data: runs }] = await Promise.all([
      supabase.from("issues").select("*").eq("video_clip_id", clipId).order("created_at", { ascending: true }),
      supabase.from("analysis_runs").select("id,no_action_needed,no_action_reason,created_at").eq("video_clip_id", clipId).order("created_at", { ascending: false }).limit(1),
    ]);
    latestAnalysisRun = runs?.[0] ?? null;
    issues = data ?? [];
    if (queueMode) await loadQueueModel();
  }

  async function loadQueueModel() {
    const { data } = await supabase.from("issues").select(`id,issue,review_status,created_at,video_clip_id,player_id,
      players!inner(id,name,slug,jersey_number,team_id), video_clips(id,status,game_log_entries(date,ab,session_type),at_bat_pitches(pitch_number),practice_repetitions(rep_number,grouping))`)
      .eq("players.team_id", ctx.team.id).order("created_at", { ascending: true });
    const normalized = (data ?? []).map((row) => ({ ...row, player: row.players, video_clip: row.video_clips ? { ...row.video_clips, game_log_entries: { ...(row.video_clips.game_log_entries ?? {}), players: row.players } } : null }));
    const skipped = JSON.parse(sessionStorage.getItem(`bt:queue-skips:${ctx.team.id}`) ?? "[]");
    queueModel = buildReviewQueue(normalized, { skippedClipIds: skipped });
    const remaining = queueRemaining(queueModel, clipId);
    const caption = document.getElementById("queueCaption");
    caption.hidden = false;
    caption.textContent = `Queue · ${remaining} more after this`;
  }

  function skipCurrent() {
    const key = `bt:queue-skips:${ctx.team.id}`;
    const skipped = new Set(JSON.parse(sessionStorage.getItem(key) ?? "[]"));
    skipped.add(clipId); sessionStorage.setItem(key, JSON.stringify([...skipped]));
    const next = queueModel?.pending.find((item) => item.clipId !== clipId && !skipped.has(item.clipId)) ?? queueModel?.pending.find((item) => item.clipId !== clipId);
    location.href = next ? `./review.html?${new URLSearchParams({ team: ctx.teamSlug, player: next.player.slug, clip: next.clipId, queue: "1" })}` : `./queue.html?team=${encodeURIComponent(ctx.teamSlug)}`;
  }

  function evidenceCtx(phase) {
    return {
      clipId,
      pitchId: clip.at_bat_pitch_id,
      repId: clip.practice_repetition_id,
      sessionId: clip.practice_repetitions?.practice_session_id ?? null,
      phase: phase ?? qs("phase") ?? null,
    };
  }

  function renderHeaderBlock() {
    const e = clip.game_log_entries;
    const swing = {
      context: e.session_type, date: e.date, ab: e.ab,
      pitchNumber: clip.at_bat_pitches?.pitch_number, repNumber: clip.practice_repetitions?.rep_number,
    };
    const atbat = e.session_type === "game" ? ctx.url("atbat", { entry: e.id }) : ctx.url("session", { session: clip.practice_repetitions?.practice_session_id ?? "" });
    document.getElementById("swingHeader").innerHTML = `<div class="p1b-swing-context"><span>${escapeHtml(L.describeSwing(swing))}</span><span>${escapeHtml([e.opponent ? `vs ${e.opponent}` : "", clip.practice_repetitions ? L.GROUPING_LABELS[clip.practice_repetitions.grouping] : ""].filter(Boolean).join(" · "))}</span></div>
      ${clip.status !== "ready" ? `<p class="hint">${clip.status === "failed" ? `Processing failed: ${escapeHtml(clip.error_message ?? "unknown error")}` : "Still processing — analysis will appear here when it finishes."}</p>` : ""}`;
  }

  async function renderWatch() {
    const el = document.getElementById("watch");
    if (clip.status !== "ready") { el.innerHTML = ""; return; }
    const url = await getVideoUrl(clipId);
    if (!url) {
      el.innerHTML = isDemoMode()
        ? emptyState("No video published for this swing", "The analysis below comes from the original footage; this clip wasn't selected for public playback.")
        : emptyState("Video unavailable", "The original video couldn't be loaded right now.");
      return;
    }
    el.innerHTML = `
      <video id="swingVideo" class="review-video" src="${url}" controls playsinline preload="metadata"></video>
      <div class="p1b-phase-track" id="phaseChips" aria-label="Swing phases">${phases.filter((p) => p.timeS != null).map((p) => `<button class="p1b-phase-tick tap-target" data-phase="${p.slug}" data-confidence="${escapeHtml(p.confidence ?? "")}"><span aria-hidden="true"></span>${escapeHtml(p.slug === "follow-through" ? "Finish" : p.label)}</button>`).join("")}</div>
      <div class="bt-video-footer">${zoomToggleHtml(zoomPreferred())}<p class="bt-caption p1b-source-note">Original video is the source of truth.${phases.some((p) => p.confidence === "low") ? " Open circles are best guesses." : ""}</p></div>`;
    videoEl = document.getElementById("swingVideo");
    wireZoomToggle(el.querySelector("[data-zoom-toggle]"), [[videoEl, unionBox(phases.map((p) => p.subjectBox))]]);
    document.getElementById("phaseChips").addEventListener("click", (e) => {
      const b = e.target.closest("[data-phase]");
      if (b) seekToPhase(b.dataset.phase);
    });
  }

  function seekToPhase(slug) {
    if (!slug) return;
    const t = L.phaseTime(phases, slug);
    if (t == null) return;
    if (videoEl) {
      const go = () => { videoEl.currentTime = videoTimeFor(clipId, t); };
      videoEl.readyState >= 1 ? go() : videoEl.addEventListener("loadedmetadata", go, { once: true });
    }
  }

  function renderAll() {
    const drafts = issues.filter((issue) => issue.review_status === "draft").length;
    const approved = issues.filter((issue) => ["approved", "edited"].includes(issue.review_status)).length;
    const rejected = issues.filter((issue) => issue.review_status === "rejected").length;
    const state = reviewFindingState({ issues, hasAnalysisRun: Boolean(latestAnalysisRun) });
    const status = state === "analyzed-empty" ? "Analysis complete" : state === "unanalyzed" ? "Not analyzed" : issues.length && drafts === 0 ? `Reviewed · ${approved} approved${rejected ? ` · ${rejected} rejected` : ""}` : reviewSummary(issues).label;
    const heading = state === "analyzed-empty" ? "Nothing flagged on this swing."
      : state === "unanalyzed" ? "This swing has not been analyzed."
      : drafts ? `${drafts} observation${drafts === 1 ? "" : "s"} awaiting coach review`
      : "Swing review complete";
    document.getElementById("reviewSummary").innerHTML = `<section class="bt-card bt-swing-review"><span class="bt-eyebrow">Swing review</span><h1 id="swingReviewTitle">${escapeHtml(heading)}</h1><p class="p1b-review-summary">${escapeHtml(status)}</p></section>`;
    renderObservations();
    renderVerificationSummary();
    renderWorkOn();
    renderLookFor();
    renderTrack();
    renderAdvanced();
    renderQueueAction();
  }

  function renderVerificationSummary() {
    const summary = derivePlayerDevelopmentSummary({ checklist: playerChecklist, priorities, assignments });
    const verified = document.getElementById("verifiedSummary");
    verified.innerHTML = summary.strengths.length
      ? `<details class="bt-card bt-review-verified"><summary><span><span class="bt-eyebrow">What's going well</span><strong>${summary.strengths.length} strength${summary.strengths.length === 1 ? "" : "s"} the coach has checked</strong></span><span class="bt-disclosure-chevron">${icon("chevron-down", { size: 20 })}</span></summary><div class="bt-disclosure-body"><p class="bt-caption">From the coach's review of all of ${escapeHtml(ctx.player.name)}'s swings, not only this one.</p><div class="bt-verified-list">${summary.strengths.map((row) => `<article><div class="bt-summary-title">${icon("check", { size: 18 })}<h3>${escapeHtml(row.label)}</h3><span class="bt-score-word">${escapeHtml(row.scoreWord ?? "")}</span></div>${row.note ? `<p>${escapeHtml(row.note)}</p>` : ""}</article>`).join("")}</div></div></details>`
      : "";
    const needs = document.getElementById("evidenceNeeds");
    needs.innerHTML = summary.needsBetterEvidence.length ? `<details class="bt-card bt-evidence-needs"><summary><span><span class="bt-eyebrow">Not judged yet</span><strong>${summary.needsBetterEvidence.length} part${summary.needsBetterEvidence.length === 1 ? "" : "s"} of the swing need${summary.needsBetterEvidence.length === 1 ? "s" : ""} clearer video</strong></span><span class="bt-disclosure-chevron">${icon("chevron-down", { size: 20 })}</span></summary><div class="bt-disclosure-body"><ul>${summary.needsBetterEvidence.map((row) => `<li>${escapeHtml(row.label)}</li>`).join("")}</ul></div></details>` : "";
  }

  function renderObservations() {
    const el = document.getElementById("observations");
    if (!issues.length) {
      el.innerHTML = latestAnalysisRun
        ? `<p class="bt-supporting bt-review-explanation">The analysis didn't flag anything for the coach to look at. That isn't a promise the swing has no issues - the coach makes that call.</p>`
        : `<p class="bt-supporting bt-review-explanation">Watch the original video above. For an analysis, capture a swing with the full body and bat visible through contact.</p>`;
      return;
    }
    const promoted = new Set(priorities.map((p) => p.source_issue_id).filter(Boolean));
    const sequence = findingSequence(issues);
    el.innerHTML = sequence.map((i) => `
      <details class="bt-card p1b-finding" data-iid="${i.id}" ${i.expanded ? "open" : ""}>
        <summary><span class="p1b-finding-title">${escapeHtml(i.issue)}</span>${statusChip(i.review_status, { domain: "review" })}</summary>
        <div class="p1b-finding-body">
          <span class="bt-label">What I see</span><p>${escapeHtml(i.evidence || i.issue)}</p>
          ${i.phase ? `<button class="p1b-evidence-link tap-target" data-a="evidence" data-phase="${escapeHtml(i.phase)}">${icon("video", { size: 16 })}<span>${escapeHtml(phases.find((p) => p.slug === i.phase)?.label ?? i.phase)} evidence</span></button>` : ""}
          ${i.effect ? `<span class="bt-label">Why it may matter</span><p class="bt-supporting">${escapeHtml(i.effect)}</p>` : ""}
          ${i.coaching_cue ? `<span class="bt-label">What to work on</span><p>${escapeHtml(i.coaching_cue)}</p>` : ""}
          <p class="bt-caption">${escapeHtml(i.confidence ? `${i.confidence[0].toUpperCase()}${i.confidence.slice(1)} confidence${i.confidence === "low" ? " · check the video" : ""}` : "Confidence not provided")} · ${i.review_status === "draft" ? "Draft from analysis" : `Coach ${i.review_status}`}</p>
          ${i.review_status === "edited" && i.ai_original ? `<details class="bt-disclosure"><summary><span>See original draft</span></summary><div class="bt-disclosure-body"><p>${escapeHtml(typeof i.ai_original === "string" ? i.ai_original : i.ai_original.issue ?? "Original draft saved")}</p></div></details>` : ""}
          ${findingActions(i, promoted.has(i.id), i.actionable)}
        </div>
      </details>`).join("");
    el.onclick = async (e) => {
      const b = e.target.closest("[data-a]"); const card = e.target.closest("[data-iid]");
      if (!b || !card) return;
      const issue = issues.find((x) => x.id === card.dataset.iid);
      try {
        if (b.dataset.a === "evidence") return seekToPhase(b.dataset.phase);
        if (b.dataset.a === "finding-menu") return openOverflowMenu({ title: "Observation actions", anchor: b, items: [
          { label: "Reject observation", icon: "x", onSelect: async () => { await reviewIssue(ctx, issue, "reject"); invalidateReviewCount(ctx.teamSlug); await reloadAll(); showSnackbar("Observation rejected", { actionLabel: "Undo", onAction: async () => { await supabase.from("issues").update({ review_status: "draft", reviewed_by: null }).eq("id", issue.id); invalidateReviewCount(ctx.teamSlug); await reloadAll(); } }); } },
        ] });
        if (b.dataset.a === "approve") return approveIssue(issue, b);
        if (b.dataset.a === "reject") {
          await reviewIssue(ctx, issue, "reject");
          showSnackbar("Observation rejected", { actionLabel: "Undo", onAction: async () => { await supabase.from("issues").update({ review_status: "draft", reviewed_by: null }).eq("id", issue.id); await reloadAll(); } });
        }
        if (b.dataset.a === "edit") return openEditIssueSheet(ctx, issue, async () => { invalidateReviewCount(ctx.teamSlug); await reloadAll(); });
        if (b.dataset.a === "promote") return openPromoteSheet(ctx, issue, reloadAll);
        await reloadAll();
        invalidateReviewCount(ctx.teamSlug);
      } catch (err) { showSnackbar("Couldn't save. Try again", { actionLabel: "Retry", onAction: reloadAll }); }
    };
  }

  // In-flight lock: a double-tap must not write twice, and Retry re-runs the approval itself.
  const approving = new Set();
  async function approveIssue(issue, button = null) {
    if (approving.has(issue.id)) return;
    approving.add(issue.id); if (button) button.disabled = true;
    try { await reviewIssue(ctx, issue, "approve"); }
    catch { showSnackbar("Couldn't approve. Try again", { actionLabel: "Retry", onAction: () => approveIssue(issue) }); approving.delete(issue.id); if (button?.isConnected) button.disabled = false; return; }
    approving.delete(issue.id);
    showSnackbar("Approved");
    try { await reloadAll(); invalidateReviewCount(ctx.teamSlug); } catch { /* the approval is saved; the list refreshes on next load */ }
  }

  function findingActions(issue, tracked, actionable) {
    const state = findingActionState(issue, tracked);
    if (state.showApprove && actionable) return `<div class="p1b-decision-row">${button("Approve", { variant: "primary", attrs: 'data-a="approve"' })}${button("Edit", { variant: "tertiary", attrs: 'data-a="edit"' })}<button class="bt-icon-button" aria-label="More observation actions" data-a="finding-menu">${icon("ellipsis-vertical", { size: 24 })}</button></div>`;
    if (state.showApprove) return '<p class="bt-caption">Decide the observation above first.</p>';
    if (state.showTrack) return `<div class="p1b-decision-row">${button("Track as priority", { variant: "secondary", attrs: 'data-a="promote"' })}${button("Edit", { variant: "tertiary", attrs: 'data-a="edit"' })}</div>`;
    return `<div class="p1b-tracked-row">${statusChip("active", { domain: "priority", label: "Tracking as a priority" })}<a href="${ctx.url("development")}">Update progress</a></div>`;
  }

  function renderQueueAction() {
    const host = document.getElementById("queueAction");
    if (!queueMode || issues.some((issue) => issue.review_status === "draft")) { host.innerHTML = ""; return; }
    const next = queueModel?.next?.clipId === clipId ? queueModel.pending.find((item) => item.clipId !== clipId) : queueModel?.next;
    if (next) {
      const left = queueModel.pending.filter((item) => item.clipId !== clipId).length;
      host.innerHTML = `<div class="bt-sticky-action-bar"><a class="bt-button bt-button-primary" href="./review.html?${new URLSearchParams({ team: ctx.teamSlug, player: next.player.slug, clip: next.clipId, queue: "1" })}">Next swing · ${left} left</a></div>`;
    } else {
      host.innerHTML = `<div class="bt-sticky-action-bar"><strong>All caught up</strong><a class="bt-button bt-button-secondary" href="./team.html?team=${encodeURIComponent(ctx.teamSlug)}">Back to Team</a></div>`;
    }
  }

  async function reloadAll() {
    [priorities] = await Promise.all([loadPriorities(ctx.player.id, ["active", "monitoring"])]);
    assignments = await loadDrillAssignments(priorities.map((p) => p.id));
    await loadIssues();
    renderAll();
  }

  function primaryPriority() {
    const promoted = priorities.find((p) => issues.some((i) => i.id === p.source_issue_id));
    return promoted ?? priorities[0] ?? null;
  }

  function renderWorkOn() {
    const el = document.getElementById("workOn");
    const p = primaryPriority();
    const top = issues.find((i) => i.review_status !== "rejected");
    if (!p) {
      el.innerHTML = "";
      return;
    }
    const assigned = assignments.filter((a) => a.player_priority_id === p.id && a.active);
    const suggested = L.suggestDrills(p, library, assigned.map((a) => a.drill_id));
    el.innerHTML = card(`<span class="bt-eyebrow">Next step</span><h2>${escapeHtml(p.title)}</h2><p class="bt-supporting">${assigned.length ? escapeHtml(assigned.map((a) => a.drill_library?.name ?? "").join(", ")) : "No drill assigned yet."}</p>
      <div class="p1b-next-step-actions">${assigned.length ? `<a class="bt-button bt-button-primary" href="${ctx.url("session", { start: 1 })}">Start practice</a>` : button("Assign drill", { variant: "secondary", attrs: 'id="assignDrill"' })}</div>`, { className: "p1b-next-step" });
    document.getElementById("assignDrill")?.addEventListener("click", () => openAssignDrillSheet(ctx, p, library, assignments.filter((a) => a.player_priority_id === p.id), reloadAll));
  }

  function renderLookFor() {
    const p = primaryPriority();
    const top = issues.find((i) => i.look_for_next);
    const text = top?.look_for_next || p?.follow_up_note;
    document.getElementById("lookFor").innerHTML = text
      ? card(`<span class="bt-label">What to look for next time</span><p>${escapeHtml(text)}</p><span class="bt-caption">${top?.review_status === "draft" ? "Draft from analysis" : "Coach-reviewed guidance"}</span>`, { compact: true }) : "";
  }

  function renderTrack() {
    const el = document.getElementById("track");
    if (!priorities.length) { el.innerHTML = ""; return; }
    const p = primaryPriority();
    el.innerHTML = card(`<div data-pid="${p.id}"><span class="bt-label">Is ${escapeHtml(p.title)} improving in this swing?</span><div class="p1b-progress-choice">${["improving", "unchanged", "worse"].map((s) => `<button class="tap-target" data-s="${s}">${s === "unchanged" ? "Same" : L.OBSERVATION_LABELS[s]}</button>`).join("")}</div></div>`, { compact: true });
    el.onclick = (e) => {
      const b = e.target.closest("[data-s]"); const card = e.target.closest("[data-pid]");
      if (!b || !card) return;
      const p = priorities.find((x) => x.id === card.dataset.pid);
      const ai = issues.find((i) => i.id === p.source_issue_id)?.look_for_next ?? null;
      openObservationSheet(ctx, p, evidenceCtx(), reloadAll, ai ? `Watch: ${ai}` : null);
    };
  }

  function renderAdvanced() {
    document.getElementById("qualityChip").innerHTML = `<span class="bt-caption">Technical details</span>`;
    document.getElementById("advancedBody").innerHTML = `<p class="hint">Per-checkpoint 1–3 scoring is optional detail. Coaches don't need to confirm every score.</p>
      <div class="dev-btns"><a class="dev-btn" style="display:inline-flex;align-items:center;text-decoration:none;" href="${ctx.url("player")}">Open detailed checklist</a></div>`;
  }

  function wireDetails() {
    let qualityDone = false, metricsDone = false;
    document.getElementById("quality").addEventListener("toggle", async (e) => {
      if (!e.target.open || qualityDone) return; qualityDone = true;
      const { data: m } = await supabase.from("video_clip_metrics").select("analysis_quality").eq("video_clip_id", clipId).maybeSingle();
      const { data: p3 } = await supabase.from("video_clip_pose3d").select("id").eq("video_clip_id", clipId).maybeSingle();
      const raw = m?.analysis_quality ?? L.deriveQualityFromPhases(phases, !!p3);
      const q = L.analysisQualityLabels(raw);
      const rows = [["Pose tracking", q.pose], ["Bat tracking", q.bat], ["Contact estimate", q.contact], ["Occlusion", q.occlusion], ["Handedness", q.handedness]];
      if (rows.every(([, v]) => !v)) { document.getElementById("qualityBody").innerHTML = '<p class="hint">Video quality wasn\'t measured for this swing. Rely on the original video.</p>'; return; }
      document.getElementById("qualityBody").innerHTML = `<div class="quality-grid">${rows.map(([l, v]) => `<span>${l}</span>${v ? pill(v, L.QUALITY_TEXT[v] ?? v) : '<span class="hint">Not measured</span>'}`).join("")}</div>
        <p class="hint">${m?.analysis_quality ? "" : "Measured from what this clip already has; pose and bat coverage weren't recorded when it was processed. "}Limited or Poor means treat automated observations as hints and rely on the original video.</p>`;
    });
    // Metrics fail closed: with no published values the Measurements drawer never appears at all.
    const metricsDrawer = document.getElementById("metricsDrawer");
    loadSwingMetrics(clipId).then((row) => {
      if (!hasPublishedMetrics(row)) { metricsDrawer.remove(); return; }
      metricsDrawer.hidden = false;
      metricsDrawer.addEventListener("toggle", (e) => {
        if (!e.target.open || metricsDone) return; metricsDone = true;
        const body = document.getElementById("metricsBody");
        renderSwingMetricsPanel(body, row);
        body.querySelector("details")?.setAttribute("open", "");
      });
    });
  }

  // requireSession redirects itself; this thin wrapper only exists so this page
  // can bail out before doing work when there is no session.
  main();
</script>
</body>
</html>
