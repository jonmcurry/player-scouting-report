<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HitterLoop — Team View</title>
<link rel="stylesheet" href="./coach.css?v=78dc330d60">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.svg">
<meta name="theme-color" content="#121418">
</head>
<body>
<header class="app-bar" id="appBar"></header>
<div class="wrap">

  <div id="devDash"></div>
  <div class="p1b-section-head"><h2 id="playersHeading">Players</h2><button class="tap-target" id="importPlayersBtn" type="button">Import players</button></div>
  <div id="playerCards" class="bt-list"></div>
  <div id="teamRecent"></div>

  <details class="bt-disclosure" id="teamInsights">
    <summary><span>Team insights</span><span class="bt-disclosure-chevron" aria-hidden="true"><svg class="bt-icon " width="20" height="20" aria-hidden="true" focusable="false"><use href="./assets/icons.svg#chevron-down"></use></svg></span></summary>
    <div class="bt-disclosure-body"><div id="focusBanner"></div>
  <div class="roster-toolbar">
    <div class="chip-row" id="chipRow">
      <button class="chip" data-filter="all" data-active="true">All Players</button>
      <button class="chip" data-filter="needsReview">⚠ Needs Review</button>
      <button class="chip" data-filter="priorityFlaws">🔴 Priority Flaws</button>
      <button class="chip" data-filter="earlyRead">⚠ Early Read (&lt;3 ABs)</button>
      <button class="chip" id="heatmapToggle" type="button" aria-pressed="false">Show checklist heat-map</button>
    </div>
    <button class="tap-target" id="teamContextBtn">Team Context</button>
    <button class="tap-target" id="addPlayerBtn">+ Add Player</button>
  </div>

  <div class="hint legend-row" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;">
    <span><span class="legend-swatch bg-score-3"></span> On Target</span>
    <span><span class="legend-swatch bg-score-2"></span> Developing</span>
    <span><span class="legend-swatch bg-score-1"></span> Needs Work</span>
    <span><span class="legend-swatch bg-score-pending"></span> Not yet scored</span>
  </div>
    </div></div>
  </details>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Dev-only, gitignored, silently absent in a real deploy - see coach/config.js -->
<script src="./demo.local.js"></script><script src="./config.local.js"></script>
<script type="module">
  import { supabase, requireSession, signOut, CHECKPOINTS, qs, escapeHtml } from "./shared.js";
  import { renderTeamAppBar, renderBottomNav, getLastPlayerSlug } from "./components/appShell.js";
  import { closeableModal } from "./components/compModal.js";
  import { openBottomSheet, showSnackbar } from "./components/ui.js";
  import { renderTeamDashboard } from "./components/teamDashboard.js";
  import { openRosterImportSheet } from "./components/rosterImportSheet.js";
  import { isDemoMode } from "./demoConfig.js";

  const MIN_ATBATS_FOR_PATTERN = 3;
  const teamSlug = qs("team");
  let currentTeamId = null;
  let currentTeam = null;
  let currentPlayers = [];
  let currentFilter = "all";

  function slugify(text) {
    return text
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  async function main() {
    const session = await requireSession();
    if (!session) return;
    if (!teamSlug) {
      document.getElementById("appBar").innerHTML = `<h1>No team specified</h1>`;
      return;
    }

    const { data: team, error: teamErr } = await supabase
      .from("teams")
      .select("id, name, sport, level_label")
      .eq("slug", teamSlug)
      .single();
    if (teamErr || !team) {
      // A real, common path - not just a typo'd URL: RLS correctly returns no
      // row for a team this coach has no coach_team_access row for (e.g. a
      // stale bookmark from before she was removed, or a link meant for a
      // different coach). The toolbar/legend/player-cards below are static
      // HTML present in the page shell regardless of load success, so
      // without this they'd stay visible looking fully functional - a coach
      // could tap "+ Add Player" and get silent nothing. Hide them and give
      // her a real way back instead of a dead end.
      document.getElementById("appBar").innerHTML = `
        <div class="app-bar-left">
          <a href="./index.html" class="app-bar-back tap-target" aria-label="Back to My Teams">‹</a>
          <div class="app-bar-titles">
            <div class="app-bar-title-row"><h1>Team not found</h1></div>
            <div class="app-bar-subtitle">This link may be wrong, or you don't have access to this team.</div>
          </div>
        </div>
      `;
      document.querySelector(".roster-toolbar").style.display = "none";
      document.querySelector(".legend-row").style.display = "none";
      document.getElementById("importPlayersBtn").hidden = true;
      return;
    }
    currentTeamId = team.id;
    currentTeam = team;

    await renderFocusBanner(team.id);
    currentPlayers = await loadPlayers(team.id);

    renderTeamAppBar(document.getElementById("appBar"), {
      teamName: team.name,
      overflowItems: [
        { label: "Add player", icon: "user-round", onSelect: openAddPlayerModal },
        ...(!isDemoMode() ? [{ label: "Import players", icon: "upload", onSelect: openImportPlayers }] : []),
        { label: "Filters & team insights", icon: "ellipsis-vertical", onSelect: () => { document.getElementById("teamInsights").open = true; document.getElementById("teamInsights").scrollIntoView({ behavior: "smooth" }); } },
        { label: "Sign out", icon: "x", onSelect: signOut },
      ],
    });

    const defaultPlayerSlug = getLastPlayerSlug(teamSlug) ?? null;
    const reportHref = defaultPlayerSlug ? `./player.html?team=${teamSlug}&player=${defaultPlayerSlug}` : "#";
    renderBottomNav(document.getElementById("bottomNav"), {
      teamSlug,
      activeTab: "roster",
      reportHref,
      roster: currentPlayers,
    });

    const dashboard = await renderTeamDashboard(
      document.getElementById("devDash"),
      team.id,
      teamSlug,
      new Map(currentPlayers.map((p) => [p.id, { id: p.id, name: p.name, slug: p.slug, teamSlug }])),
    );
    renderPlayerCards(currentPlayers, currentFilter, dashboard);

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        if (chip.id === "heatmapToggle") {
          const show = chip.getAttribute("aria-pressed") !== "true";
          chip.setAttribute("aria-pressed", String(show));
          document.body.classList.toggle("show-team-heatmap", show);
          chip.textContent = show ? "Hide checklist heat-map" : "Show checklist heat-map";
          return;
        }
        document.querySelectorAll(".chip").forEach((c) => c.removeAttribute("data-active"));
        chip.setAttribute("data-active", "true");
        currentFilter = chip.dataset.filter;
        renderPlayerCards(currentPlayers, currentFilter, dashboard);
      });
    });

    document.getElementById("addPlayerBtn").addEventListener("click", openAddPlayerModal);
    if (isDemoMode()) document.getElementById("importPlayersBtn").hidden = true;
    else document.getElementById("importPlayersBtn").addEventListener("click", openImportPlayers);
    document.getElementById("teamContextBtn").addEventListener("click", openTeamContextModal);
    if (qs("addPlayer") === "1") {
      openAddPlayerModal();
      const url = new URL(location.href); url.searchParams.delete("addPlayer"); history.replaceState(history.state, "", url);
    }
  }

  function openImportPlayers() {
    openRosterImportSheet({ supabase, teamId: currentTeamId, existing: currentPlayers,
      onDone: async ({ created, updated }) => {
        currentPlayers = await loadPlayers(currentTeamId);
        renderPlayerCards(currentPlayers, currentFilter);
        showSnackbar(`Imported ${created} player${created === 1 ? "" : "s"}; updated ${updated} jersey number${updated === 1 ? "" : "s"}. Invite parents from each player's page.`);
      },
    });
  }

  function option(value, label, selected) {
    return `<option value="${value}" ${selected === value ? "selected" : ""}>${label}</option>`;
  }

  function openTeamContextModal() {
    const backdrop = closeableModal(`<div class="modal"><button class="close-btn tap-target">✕</button><h2 style="margin-top:0;">Team Context</h2>
      <p class="hint">Used by future AI analyses. Unknown values stay unknown.</p>
      <select id="editTeamSport">${option("", "Sport unknown", currentTeam.sport ?? "")}${option("softball", "Softball", currentTeam.sport)}${option("baseball", "Baseball", currentTeam.sport)}</select>
      <input id="editTeamLevel" placeholder="Level (e.g. 10U)" value="${escapeHtml(currentTeam.level_label ?? "")}">
      <button class="primary tap-target" id="saveTeamContext">Save</button><p class="error-text" id="teamContextError"></p></div>`);
    backdrop.querySelector("#saveTeamContext").onclick = async () => {
      const patch = { sport: backdrop.querySelector("#editTeamSport").value || null, level_label: backdrop.querySelector("#editTeamLevel").value.trim() || null };
      const { error } = await supabase.from("teams").update(patch).eq("id", currentTeamId);
      if (error) return backdrop.querySelector("#teamContextError").textContent = error.message;
      Object.assign(currentTeam, patch); backdrop.remove();
    };
  }

  /** Reuses compModal.js's shared modal-backdrop shell rather than a new
   * pattern - same `.modal`/`.close-btn` markup this app already uses for
   * every other overlay. */
  function openAddPlayerModal() {
    const backdrop = openBottomSheet({ title: "Add player", bodyHtml: `
        <input type="text" id="newPlayerName" placeholder="Player name (e.g. Alex R)">
        <input type="text" id="newPlayerJersey" placeholder="Jersey number">
        <input type="text" id="newPlayerSlug" placeholder="URL slug (auto-filled from name)">
        <select id="newPlayerAge"><option value="">Age band unknown</option>${["u8","8-10","11-12","13-14","15-18","adult"].map((v) => `<option value="${v}">${v}</option>`).join("")}</select>
        <select id="newPlayerBats"><option value="">Bats unknown</option><option value="L">Left</option><option value="R">Right</option><option value="S">Switch</option></select>
        <select id="newPlayerThrows"><option value="">Throws unknown</option><option value="L">Left</option><option value="R">Right</option></select>
        <button class="primary tap-target" id="savePlayerBtn" style="margin-top:10px;">Add Player</button>
        <p class="error-text" id="addPlayerErrorMsg"></p>
    ` });

    backdrop.querySelector("#newPlayerName").addEventListener("input", (e) => {
      backdrop.querySelector("#newPlayerSlug").value = slugify(e.target.value);
    });

    backdrop.querySelector("#savePlayerBtn").addEventListener("click", async () => {
      const name = backdrop.querySelector("#newPlayerName").value.trim();
      const jerseyNumber = backdrop.querySelector("#newPlayerJersey").value.trim();
      const slug = backdrop.querySelector("#newPlayerSlug").value.trim() || slugify(name);
      const ageBand = backdrop.querySelector("#newPlayerAge").value || null;
      const bats = backdrop.querySelector("#newPlayerBats").value || null;
      const throws = backdrop.querySelector("#newPlayerThrows").value || null;
      const errorMsg = backdrop.querySelector("#addPlayerErrorMsg");
      errorMsg.textContent = "";

      if (!name) { errorMsg.textContent = "Enter a player name."; return; }
      if (!jerseyNumber) { errorMsg.textContent = "Enter a jersey number."; return; }
      if (!slug) { errorMsg.textContent = "Enter a URL slug."; return; }

      const { error } = await supabase
        .from("players")
        .insert({ team_id: currentTeamId, name, jersey_number: jerseyNumber, slug, age_band: ageBand, bats, throws });
      if (error) {
        errorMsg.textContent = error.message.includes("duplicate key")
          ? "A player with that slug already exists on this team - try a different one."
          : error.message;
        return;
      }

      backdrop.remove();
      currentPlayers = await loadPlayers(currentTeamId);
      renderPlayerCards(currentPlayers, currentFilter);
    });
  }

  async function renderFocusBanner(teamId) {
    const { data, error } = await supabase
      .from("team_summary_stats")
      .select("checkpoint_label, avg_score, is_team_weakness")
      .eq("team_id", teamId)
      .eq("is_team_weakness", true)
      .order("avg_score", { ascending: true });

    const el = document.getElementById("focusBanner");
    if (error || !data || data.length === 0) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML = `
      <div class="focus-banner">
        <h2>Team focus areas (avg &lt; 2.0)</h2>
        <ul>
          ${data.map((d) => `<li><b>${escapeHtml(d.checkpoint_label)}</b> — avg ${Number(d.avg_score).toFixed(1)}</li>`).join("")}
        </ul>
      </div>
    `;
  }

  /** Batches the whole team's checklist scores + game-log counts into 2
   * queries total regardless of roster size, instead of the 2-per-player
   * round trips this used to make (real N+1: a 20-player roster meant 40+
   * sequential requests before the page could render). */
  async function loadPlayers(teamId) {
    const { data: players, error } = await supabase
      .from("players")
      .select("id, name, jersey_number, slug")
      .eq("team_id", teamId)
      .order("name");
    if (error || !players || players.length === 0) return [];

    const playerIds = players.map((p) => p.id);
    const [{ data: allScores }, { data: allGameLogs }] = await Promise.all([
      supabase
        .from("checklist_scores")
        .select("player_id, score, reviewed_by, review_status, checkpoints!inner(slug, sort_order)")
        .in("player_id", playerIds)
        .order("sort_order", { referencedTable: "checkpoints" }),
      // session_type='game' - "Early Read (<3 ABs)" is a real-game concept;
      // a batting-practice rep isn't an at-bat (see 00015_practice_sessions.sql).
      supabase.from("game_log_entries").select("player_id").eq("session_type", "game").in("player_id", playerIds),
    ]);

    const scoresByPlayer = new Map();
    for (const s of allScores ?? []) {
      if (!scoresByPlayer.has(s.player_id)) scoresByPlayer.set(s.player_id, []);
      scoresByPlayer.get(s.player_id).push(s);
    }
    const abCountByPlayer = new Map();
    for (const g of allGameLogs ?? []) {
      abCountByPlayer.set(g.player_id, (abCountByPlayer.get(g.player_id) ?? 0) + 1);
    }

    for (const p of players) {
      const scores = scoresByPlayer.get(p.id) ?? [];
      p.scoresBySlug = new Map(scores.map((s) => [s.checkpoints.slug, s]));
      const scored = scores.filter((s) => s.score !== null);
      p.scoredCount = scored.length;
      p.reviewedCount = scored.filter((s) => s.reviewed_by).length;
      p.abCount = abCountByPlayer.get(p.id) ?? 0;
    }
    return players;
  }

  function matchesFilter(player, filter) {
    const rows = [...player.scoresBySlug.values()];
    if (filter === "all") return true;
    if (filter === "needsReview") return rows.some((r) => r.score != null && !r.reviewed_by);
    if (filter === "priorityFlaws") return rows.some((r) => r.score === 1);
    if (filter === "earlyRead") return player.abCount < MIN_ATBATS_FOR_PATTERN;
    return true;
  }

  function renderPlayerCards(players, filter, dashboard = null) {
    const container = document.getElementById("playerCards");
    const reviewByPlayer = new Map((dashboard?.needsReview ?? []).map((row) => [row.id, row.n]));
    const priorityByPlayer = new Map((dashboard?.players ?? []).map((group) => [group.player.id, group.priorities[0]]));
    const dueIds = new Set((dashboard?.dueFollowUps ?? []).map((priority) => priority.players.id));
    const filtered = players.filter((p) => matchesFilter(p, filter)).sort((a, b) =>
      Number(Boolean(reviewByPlayer.get(b.id))) - Number(Boolean(reviewByPlayer.get(a.id))) ||
      Number(dueIds.has(b.id)) - Number(dueIds.has(a.id)) || a.name.localeCompare(b.name));
    document.getElementById("playersHeading").textContent = `Players (${filtered.length})`;
    if (filtered.length === 0) {
      container.innerHTML = `<div class="bt-state bt-empty-state"><strong>No players match this filter</strong><span>Choose another filter or add a player.</span></div>`;
      return;
    }
    container.innerHTML = filtered
      .map((p) => {
        const blocks = CHECKPOINTS.map((cp) => {
          const row = p.scoresBySlug.get(cp.slug);
          const cls = row?.score ? `bg-score-${row.score}` : "bg-score-pending";
          return `<div class="block ${cls}" title="${escapeHtml(cp.label)}: ${row?.score ?? "—"}"></div>`;
        }).join("");
        const reviewCount = reviewByPlayer.get(p.id) ?? 0;
        const priority = priorityByPlayer.get(p.id);
        const scoreRows = [...p.scoresBySlug.values()];
        const strengthCount = scoreRows.filter((row) => row.review_status === "verified" && row.score === 3).length;
        // Development state first: the Priority, anything waiting on the coach, then what is already verified.
        const status = [priority ? `Priority: ${priority.title}` : "No Priority yet",
          reviewCount ? `${reviewCount} observation${reviewCount === 1 ? "" : "s"} to review` : null,
          strengthCount ? `${strengthCount} strength${strengthCount === 1 ? "" : "s"} checked by the coach` : null].filter(Boolean).join(" · ");
        return `<a class="bt-list-row p1b-roster-row" href="./player.html?team=${encodeURIComponent(teamSlug)}&player=${encodeURIComponent(p.slug)}">
          <span class="bt-list-row-leading"><span class="jersey-badge">${escapeHtml(p.jersey_number)}</span></span>
          <span class="bt-list-row-copy"><span class="bt-list-row-title p1b-player-name">${escapeHtml(p.name)}</span><span class="bt-list-row-supporting">${escapeHtml(status)}</span><span class="mini-heatmap">${blocks}</span></span>
          <span class="bt-list-row-trailing"><span class="bt-button bt-button-secondary">Open ${escapeHtml(p.name)}</span></span></a>`;
      })
      .join("");
  }

  main();
</script>
</body>
</html>
