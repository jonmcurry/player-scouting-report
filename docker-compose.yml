# Local dev only. Does NOT include Postgres/Auth/Storage/Studio - `supabase start`
# (via the Supabase CLI, its own separate Docker Compose under the hood) must
# already be running before `docker compose up` here; see supabase/ and the
# README for the two-step local dev flow. This file only contains what the
# project itself needs on top of that: the Node CLI image, and a zero-cost GCS
# emulator so dev/test never touches real Google Cloud Storage or incurs cost.
services:
  node-cli:
    build: .
    env_file:
      - .env
    environment:
      # Docker Desktop's host-gateway lets the container reach the `supabase
      # start` stack running directly on the host (not in this compose file).
      SUPABASE_URL: http://host.docker.internal:54321
      GCS_EMULATOR_HOST: http://gcs-emulator:4443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./videos:/app/videos
      - ./frames:/app/frames
      - ./reports:/app/reports
    depends_on:
      - gcs-emulator

  gcs-emulator:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-public-host", "gcs-emulator:4443"]
    # No host port publish here - fake-gcs-server is missing
    # Access-Control-Allow-Methods on its CORS preflight response, which real
    # browsers require (unlike curl, which ignores CORS entirely). Everything
    # external goes through gcs-cors-proxy below instead, which adds the
    # missing header; GCS_EMULATOR_HOST/port 4443 stays the same from every
    # caller's perspective.
    volumes:
      # Without a persistent volume, fake-gcs-server's filesystem backend
      # (its default) lives only in the container's writable layer - any
      # `docker compose up`/recreate wipes every bucket that was ever
      # created, including softball-scouting-media, causing a real 404
      # on the very next upload (hit this directly while adding
      # gcs-cors-proxy above).
      - gcs-emulator-data:/storage

  gcs-cors-proxy:
    image: nginx:alpine
    volumes:
      - ./docker/gcs-cors-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4443:4443"
    depends_on:
      - gcs-emulator

volumes:
  gcs-emulator-data:
