# fake-gcs-server (see docker-compose.yml's gcs-emulator service) answers CORS
# preflight OPTIONS requests with Access-Control-Allow-Origin/-Headers but no
# Access-Control-Allow-Methods - confirmed directly (curl vs a real browser):
# curl ignores CORS and "succeeds" against the emulator directly, but a real
# browser (Chromium WebView in the Capacitor coach app) requires
# Access-Control-Allow-Methods on the preflight response before it will send
# the actual upload request, and silently aborts with a bare "Failed to
# fetch" otherwise - the emulator's own container logs show the OPTIONS
# preflight landing (200) but the real POST never following.
# fsouza/fake-gcs-server has no CLI flag to add this header itself
# (-cors-headers only controls Access-Control-Allow-Headers), so this thin
# reverse proxy sits in front of it purely to add the one missing header.
# Dev-only - never a concern for a real GCS bucket, which sets this header
# correctly on its own signed-URL uploads.
server {
    listen 4443;
    # Real coach uploads are full-game video, seen up to ~1GB in this project
    # (see [[pose3d_crash_tolerance_fix]]) - nginx's own default
    # client_max_body_size (1m) would reject those long before they ever
    # reach fake-gcs-server, confirmed via a real 413 in this proxy's own
    # access log against a real ~965MB upload attempt.
    client_max_body_size 0;

    location / {
        proxy_pass http://gcs-emulator:4443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
        # A ~1GB upload over the emulator's slow virtual network (real ~480ms
        # ping RTT observed) can take a while - nginx's 60s default would cut
        # it off mid-transfer.
        client_body_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
